// ── Pool ─────────────────────────────────────────────────────
function buildFmlPool(){
  const pool = FML_DATA.map(item => ({...item}));
  for(let i = pool.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool;
}

// ── Token helpers ────────────────────────────────────────────
// For a phase, flatten all token keys into one string = the full key
function phaseKey(phase){ return phase.tokens.map(tk=>tk.k).join(''); }

// Build visual HTML for a phase, colouring tokens by how much has been typed
// typed = string typed so far; state = 'active'|'done'|'future'|'wrong'
function buildPhaseHTML(phase, typedSoFar, rowState){
  let html = '';
  let consumed = 0; // chars consumed from typedSoFar
  const total = typedSoFar.length;

  for(const tk of phase.tokens){
    const klen = tk.k.length;
    const start = consumed;
    const end   = consumed + klen;

    let cls;
    if(rowState === 'done'){
      cls = 'done';
    } else if(rowState === 'future'){
      cls = ''; // dim (default)
    } else if(rowState === 'wrong'){
      // active row, wrong state — all pending become wrong-ish but show dim
      if(start < total) cls = 'done'; // already typed bits stay done
      else cls = ''; // rest dim
    } else {
      // active row
      if(end <= total){
        cls = 'done';
      } else if(start < total){
        cls = 'active'; // partially typed token
      } else {
        cls = 'active'; // next token to type
        // only the very first untyped token gets the active class; rest stay dim
        // Fix: only the immediately-next token is active, rest are ''
      }
    }

    // Refine: only the current token (first not fully typed) is 'active'; subsequent ones are ''
    if(rowState === 'active'){
      if(end <= total){
        cls = 'done';
      } else if(start <= total && total < end){
        cls = 'active';
      } else {
        cls = ''; // future token within this row
      }
    }

    html += `<span class="fml-tok ${cls}">${tk.h}</span>`;
    consumed = end;
  }
  return html;
}

// ── Build cursor element ──────────────────────────────────────
function insertCursor(rowEl){
  const cur = document.createElement('span');
  cur.className = 'fml-cursor';
  rowEl.appendChild(cur);
}

// ── Start/stop ───────────────────────────────────────────────
function startFmlSession(){
  autoFillMode = false;
  if(fmlAutoHandle){ clearTimeout(fmlAutoHandle); fmlAutoHandle=null; }
  fmlPool     = buildFmlPool();
  fmlIdx      = 0;
  fmlAnswered = 0;
  fmlFinished = false;
  fmlLocked   = false;
  fmlStopTimer();
  fmlTimerEl.textContent = '00:00.00';
  fmlProgressEl.textContent = `0 / ${fmlPool.length}`;
  fmlUpdatePR();
  document.getElementById('fmlFinishOverlay').style.opacity = '0';
  document.getElementById('fmlFinishOverlay').style.pointerEvents = 'none';
  fmlNextQuestion();
}

function stopFml(){
  fmlStopTimer();
  if(fmlAutoHandle){ clearTimeout(fmlAutoHandle); fmlAutoHandle=null; }
  if(window._fmlCdInterval){ clearInterval(window._fmlCdInterval); window._fmlCdInterval=null; }
  fmlLocked   = true;
  fmlFinished = false;
  document.getElementById('fmlFinishOverlay').style.opacity = '0';
  document.getElementById('fmlFinishOverlay').style.pointerEvents = 'none';
}

// ── Render question ──────────────────────────────────────────
function fmlNextQuestion(){
  if(fmlIdx >= fmlPool.length){ fmlFinishSession(); return; }
  fmlCurrent   = fmlPool[fmlIdx++];
  fmlPhase     = 0;
  fmlTyped     = '';
  fmlLocked    = false;
  fmlWrongCount= 0;
  fmlHintEl.innerHTML = '';

  fmlSectionEl.textContent = fmlCurrent.section;
  fmlPromptEl.textContent  = fmlCurrent.prompt;
  fmlRebuildDisplay();

  fmlLineEl.classList.remove('anim');
  void fmlLineEl.offsetWidth;
  fmlLineEl.classList.add('anim');
}

function fmlRebuildDisplay(wrongPhase){
  fmlLineEl.innerHTML = '';
  const phases = fmlCurrent.phases;
  const isMulti = phases.length > 1;

  for(let i = 0; i < phases.length; i++){
    const phase = phases[i];
    const row = document.createElement('div');
    row.className = 'fml-phase-row';
    row.id = `fml-row-${i}`;

    if(isMulti){
      const lbl = document.createElement('span');
      lbl.className = 'fml-phase-label';
      lbl.textContent = `${i+1}.`;
      row.appendChild(lbl);
    }

    let rowState, typed;
    if(i < fmlPhase){
      rowState = 'done';
      typed = phaseKey(phase);
    } else if(i === fmlPhase){
      rowState = (wrongPhase === i) ? 'wrong' : 'active';
      typed = fmlTyped;
    } else {
      rowState = 'future';
      typed = '';
    }

    row.innerHTML += buildPhaseHTML(phase, typed, rowState);
    if(i === fmlPhase && wrongPhase !== i) insertCursor(row);
    fmlLineEl.appendChild(row);
  }
}

// ── Input handling ───────────────────────────────────────────
function fmlHandleChar(ch){
  if(fmlLocked || fmlFinished) return;
  fmlStartTimer();

  const phase  = fmlCurrent.phases[fmlPhase];
  const target = phaseKey(phase);
  const next   = fmlTyped + ch;

  if(!target.startsWith(next)){
    fmlTyped = '';
    fmlWrongCount++;
    if(fmlWrongCount >= 3){
      // show visual hint
      fmlHintEl.innerHTML = '';
      for(const tk of phase.tokens){
        const s = document.createElement('span');
        s.className = 'fml-tok done';
        s.innerHTML = tk.h;
        fmlHintEl.appendChild(s);
      }
    }
    const row = document.getElementById(`fml-row-${fmlPhase}`);
    if(row){
      row.classList.remove('shaking');
      void row.offsetWidth;
      row.classList.add('shaking');
      setTimeout(()=>{
        row.classList.remove('shaking');
        fmlRebuildDisplay();
      }, 380);
    }
    return;
  }

  fmlTyped = next;

  if(fmlTyped === target){
    fmlPhase++;
    fmlTyped = '';
    fmlWrongCount = 0;
    fmlHintEl.innerHTML = '';

    if(fmlPhase >= fmlCurrent.phases.length){
      fmlAnswered++;
      fmlProgressEl.textContent = `${fmlAnswered} / ${fmlPool.length}`;
      fmlLocked = true;
      // show all done then advance
      fmlRebuildDisplay();
      setTimeout(()=>{ fmlNextQuestion(); }, 380);
    } else {
      fmlRebuildDisplay();
    }
  } else {
    // update display with progress
    fmlRebuildDisplay();
  }
}

function fmlHandleBackspace(){
  if(fmlLocked || fmlFinished) return;
  if(fmlTyped.length > 0){
    fmlTyped = fmlTyped.slice(0, -1);
    fmlRebuildDisplay();
  }
}

// ── Auto-fill ────────────────────────────────────────────────
function fmlAutoFill(){
  if(fmlAutoHandle) return;
  autoFillMode = true;
  function tick(){
    if(currentMode !== 'formulas' || fmlFinished){ fmlAutoHandle=null; return; }
    if(fmlLocked){ fmlAutoHandle = setTimeout(tick, 60); return; }
    const phase  = fmlCurrent.phases[fmlPhase];
    const target = phaseKey(phase);
    if(fmlTyped.length < target.length){
      fmlHandleChar(target[fmlTyped.length]);
    }
    fmlAutoHandle = setTimeout(tick, 55);
  }
  fmlAutoHandle = setTimeout(tick, 80);
}

// ── Finish ───────────────────────────────────────────────────
function fmlFinishSession(){
  fmlFinished = true;
  const elapsed = Date.now() - fmlStartMs;
  fmlStopTimer();
  const result = saveRecord('formulas', 0, elapsed);

  const fo = document.getElementById('fmlFinishOverlay');
  document.getElementById('fmlFinishTime').textContent = fmtMs(elapsed);
  document.getElementById('fmlFinishLabel').textContent = `fórmulas · ${fmlPool.length} questões`;
  const fd = document.getElementById('fmlFinishDelta');
  if(autoFillMode){
    fd.textContent = '∗ modo automático · não salvo';
    fd.style.color = 'var(--txt-dim)';
  } else if(result.isNew){
    if(result.prev === null){
      fd.textContent = '◆ primeiro recorde';
      fd.style.color = 'var(--ac)';
    } else {
      fd.textContent = `▲ ${fmtMs(result.prev - elapsed)} mais rápido · novo recorde`;
      fd.style.color = 'var(--correct)';
    }
  } else {
    fd.textContent = `▼ ${fmtMs(elapsed - result.prev)} mais lento · recorde: ${fmtMs(result.prev)}`;
    fd.style.color = 'var(--wrong)';
  }

  document.getElementById('fmlOverlay').classList.remove('visible');
  fo.style.opacity = '1';
  fo.style.pointerEvents = 'auto';

  let cd = 5;
  const cdEl = document.getElementById('fmlFinishCountdown');
  if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
  if(window._fmlCdInterval) clearInterval(window._fmlCdInterval);
  window._fmlCdInterval = setInterval(()=>{
    cd--;
    if(cd <= 0){
      clearInterval(window._fmlCdInterval);
      window._fmlCdInterval = null;
      if(fmlFinished) startFmlSession();
    } else {
      if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
    }
  }, 1000);
}

// ── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', function(e){
  if(currentMode !== 'formulas') return;

  if(fmlFinished){
    if(e.key === ' '){ e.preventDefault(); startFmlSession(); }
    if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); }
    return;
  }

  if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); fmlHandleBackspace(); return; }
  if(e.key === 'Enter'){ e.preventDefault(); return; }

  if(e.key.length === 1){
    e.preventDefault();
    fmlHandleChar(e.key);
  }
}, true);


// ═══════════════════════════════════════════════════════════════
// DRILL MODE — repeat (× e raízes)
// ═══════════════════════════════════════════════════════════════
const DRILL_KINDS = [
  {id:'times',      label:'× contas'},
  {id:'sqrt_exact', label:'√ exatas'},
  {id:'sqrt_approx',label:'√ aprox'},
  {id:'sqrt_simpl', label:'√ simplif'},
  {id:'cbrt_exact', label:'∛ exatas'},
  {id:'cbrt_approx',label:'∛ aprox'},
  {id:'cbrt_simpl', label:'∛ simplif'}
];
let drillKind = 'times';
const drillSel = {};            // chave -> Set de índices selecionados
let drillReps = 5, drillStrict = true;
let drillRunning = false, drillDone = false;
let drillItems = [], drillItemIdx = 0, drillRep = 0;
let drillPhase = 'A', drillTypedA = '', drillTypedB = '', drillLocked = false, drillTO = null;

const dPicker = document.getElementById('drillPicker');
const dRun    = document.getElementById('drillRun');
const dTabs   = document.getElementById('drillTabs');
const dChips  = document.getElementById('drillChips');
const dRepIn  = document.getElementById('drillRepInput');
const dStreakBtn = document.getElementById('drillStreakBtn');
const dHint   = document.getElementById('drillHint');
const dInfo   = document.getElementById('drillInfo');
const dProg   = document.getElementById('drillProg');
const dMsg    = document.getElementById('drillMsg');
const dRow    = document.getElementById('drillRow');
const dLine   = document.getElementById('drillLine');
const dQ      = document.getElementById('drillQ');
const dWrapA  = document.getElementById('drillWrapA');
const dAnsA   = document.getElementById('drillAnsA');
const dSep    = document.getElementById('drillSep');
const dSym    = document.getElementById('drillSym');
const dWrapB  = document.getElementById('drillWrapB');
const dAnsB   = document.getElementById('drillAnsB');

function drillSelKey(){ return drillKind==='times' ? 'times'+N : drillKind; }
function drillGetSel(){ const k = drillSelKey(); return drillSel[k] || (drillSel[k] = new Set()); }
function drillIsApprox(){ return drillKind==='sqrt_approx' || drillKind==='cbrt_approx'; }

function drillAllItems(kind){
  if(kind==='times'){
    const L = [];
    for(let a=2;a<=30;a++) for(let b=1;b<=N;b++)
      L.push({label:`${a}×${b}`, grp:a, q:`${a} × ${b} =`, ansA:String(a*b)});
    return L;
  }
  if(kind==='sqrt_exact')  return SQRT_EXACT.map(([r,a])=>({label:'√'+r,q:`√ ${r} =`,ansA:String(a)}));
  if(kind==='sqrt_approx') return SQRT_APPROX.map(([r,a])=>({label:'√'+r,q:`√ ${r} ≈`,ansA:a}));
  if(kind==='sqrt_simpl')  return SQRT_SIMPL.map(([r,c,i])=>({label:'√'+r,q:`√ ${r} =`,ansA:String(c),ansB:String(i),sym:'√'}));
  if(kind==='cbrt_exact')  return CBRT_EXACT.map(([r,a])=>({label:'∛'+r,q:`∛ ${r} =`,ansA:String(a)}));
  if(kind==='cbrt_approx') return CBRT_APPROX.map(([r,a])=>({label:'∛'+r,q:`∛ ${r} ≈`,ansA:a}));
  return CBRT_SIMPL.map(([r,c,i])=>({label:'∛'+r,q:`∛ ${r} =`,ansA:String(c),ansB:String(i),sym:'∛'}));
}

function drillUpdateHint(msg){
  if(msg){ dHint.textContent = msg; return; }
  const n = drillGetSel().size;
  dHint.textContent = n
    ? `${n} selecionada${n===1?'':'s'} · ${n*(drillReps||0)} acertos no total`
    : 'toque nas contas para selecionar';
}

function drillRenderTabs(){
  dTabs.innerHTML = '';
  DRILL_KINDS.forEach(k=>{
    const b = document.createElement('button');
    b.className = 'dr-tab' + (k.id===drillKind ? ' on' : '');
    b.textContent = k.label;
    b.addEventListener('click', ()=>{ drillKind = k.id; drillRenderTabs(); drillRenderChips(); drillUpdateHint(); });
    dTabs.appendChild(b);
  });
}

function drillRenderChips(){
  const keepScroll = dChips.scrollTop;
  const items = drillAllItems(drillKind), sel = drillGetSel();
  dChips.innerHTML = '';
  const grouped = drillKind === 'times';
  let row = null, lastGrp = null;
  if(!grouped){ row = document.createElement('div'); row.className='dr-row'; dChips.appendChild(row); }
  items.forEach((it,i)=>{
    if(grouped && it.grp !== lastGrp){
      lastGrp = it.grp;
      row = document.createElement('div'); row.className='dr-row'; dChips.appendChild(row);
      const g = document.createElement('button');
      g.className = 'dr-chip dr-grp';
      g.textContent = it.grp + '×';
      g.title = 'selecionar a tabuada toda';
      g.addEventListener('click', ()=>{
        const idxs = []; items.forEach((x,j)=>{ if(x.grp===it.grp) idxs.push(j); });
        const all = idxs.every(j=>sel.has(j));
        idxs.forEach(j=>{ all ? sel.delete(j) : sel.add(j); });
        drillRenderChips(); drillUpdateHint();
      });
      row.appendChild(g);
    }
    const c = document.createElement('button');
    c.className = 'dr-chip' + (sel.has(i) ? ' sel' : '');
    c.textContent = it.label;
    c.addEventListener('click', ()=>{
      if(sel.has(i)) sel.delete(i); else sel.add(i);
      c.classList.toggle('sel', sel.has(i));
      drillUpdateHint();
    });
    row.appendChild(c);
  });
  dChips.scrollTop = keepScroll;
}

function drillShowPicker(){
  clearTimeout(drillTO); drillTO = null;
  drillRunning = false; drillDone = false;
  dRun.classList.remove('on');
  dPicker.style.display = 'flex';
  dRepIn.value = String(drillReps);
  dStreakBtn.textContent = 'erro zera: ' + (drillStrict ? 'sim' : 'não');
  drillRenderTabs(); drillRenderChips(); drillUpdateHint();
}

function stopDrill(){
  clearTimeout(drillTO); drillTO = null;
  drillRunning = false; drillDone = false; drillLocked = true;
}

function drillSyncReps(){ dRepIn.value = String(drillReps); drillUpdateHint(); }
dRepIn.addEventListener('input', ()=>{
  const v = dRepIn.value.replace(/\D/g,'').slice(0,3);
  dRepIn.value = v;
  drillReps = parseInt(v,10) || 0;
  drillUpdateHint();
});
dRepIn.addEventListener('blur', ()=>{ if(drillReps < 1){ drillReps = 1; } drillSyncReps(); });
document.getElementById('drillRepDown').addEventListener('click', ()=>{ drillReps = Math.max(1, (drillReps||1)-1); drillSyncReps(); });
document.getElementById('drillRepUp').addEventListener('click', ()=>{ drillReps = Math.min(999, (drillReps||0)+1); drillSyncReps(); });
dStreakBtn.addEventListener('click', ()=>{
  drillStrict = !drillStrict;
  dStreakBtn.textContent = 'erro zera: ' + (drillStrict ? 'sim' : 'não');
});
document.getElementById('drillAll').addEventListener('click', ()=>{
  const sel = drillGetSel(); drillAllItems(drillKind).forEach((_,i)=>sel.add(i));
  drillRenderChips(); drillUpdateHint();
});
document.getElementById('drillNone').addEventListener('click', ()=>{
  drillGetSel().clear(); drillRenderChips(); drillUpdateHint();
});
document.getElementById('drillToEnd').addEventListener('click', ()=>{
  const sel = drillGetSel();
  if(!sel.size){ drillUpdateHint('marque a primeira conta e use "até o fim"'); return; }
  const first = Math.min(...sel);
  drillAllItems(drillKind).forEach((_,i)=>{ if(i>=first) sel.add(i); });
  drillRenderChips(); drillUpdateHint();
});
document.getElementById('drillGo').addEventListener('click', drillStart);
document.getElementById('drillStop').addEventListener('click', ()=>{ stopDrill(); drillShowPicker(); });
document.getElementById('modeDrillBtn').addEventListener('click', ()=>{ setMode('drill'); });

function drillStart(){
  if(drillReps < 1){ drillUpdateHint('digite quantas repetições (mínimo 1)'); dRepIn.focus(); return; }
  const sel = drillGetSel();
  if(!sel.size){ drillUpdateHint('selecione ao menos uma conta'); return; }
  const all = drillAllItems(drillKind);
  drillItems = [...sel].sort((a,b)=>a-b).map(i=>all[i]);
  drillItemIdx = -1;
  drillRunning = true; drillDone = false;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  dPicker.style.display = 'none';
  dRun.classList.add('on');
  dMsg.textContent = '';
  drillNextItem();
}

function drillUpdateProg(){
  const dots = drillReps <= 15 ? '●'.repeat(drillRep) + '○'.repeat(Math.max(0,drillReps-drillRep)) + '   ' : '';
  dProg.textContent = dots + drillRep + ' / ' + drillReps;
}

function drillNextItem(){
  drillItemIdx++;
  if(drillItemIdx >= drillItems.length){ drillFinish(); return; }
  drillRep = 0;
  drillSetQuestion();
}

function drillSetQuestion(){
  const cur = drillItems[drillItemIdx];
  const simpl = !!cur.ansB;
  drillPhase = 'A'; drillTypedA = ''; drillTypedB = ''; drillLocked = false;
  dRow.style.display = '';
  dQ.textContent = cur.q + ' ';
  dWrapA.className = 'roots-ans-wrap';
  dAnsA.textContent = '_';
  if(simpl){
    dSep.style.display = ''; dSym.textContent = cur.sym; dSym.style.display = '';
    dWrapB.style.display = ''; dWrapB.className = 'roots-ans-wrap'; dAnsB.textContent = '_';
  } else {
    dSep.style.display = 'none'; dSym.style.display = 'none'; dWrapB.style.display = 'none';
  }
  dInfo.textContent = `${drillItemIdx+1} / ${drillItems.length}`;
  drillUpdateProg();
  dLine.classList.remove('anim'); void dLine.offsetWidth; dLine.classList.add('anim');
}

function drillShake(wrap){
  wrap.classList.remove('shaking');
  wrap.classList.add('wrong');
  void wrap.offsetWidth;
  wrap.classList.add('shaking');
  setTimeout(()=>wrap.classList.remove('shaking'), 380);
  if(drillStrict && drillRep > 0){ drillRep = 0; drillUpdateProg(); }
}

function drillHandleDigit(key){
  if(drillLocked || !drillRunning || drillDone) return;
  const cur = drillItems[drillItemIdx];
  const simpl = !!cur.ansB;
  if(drillPhase === 'A'){
    const next = drillTypedA + key;
    if(!cur.ansA.startsWith(next)){
      drillTypedA = ''; dAnsA.textContent = '_'; drillShake(dWrapA); return;
    }
    drillTypedA = next;
    dAnsA.textContent = drillIsApprox() ? rootsFmtApprox(next) : next;
    dWrapA.classList.remove('wrong');
    if(next === cur.ansA){
      dWrapA.classList.add('correct');
      if(simpl) drillPhase = 'B'; else drillCorrect();
    }
  } else {
    const next = drillTypedB + key;
    if(!cur.ansB.startsWith(next)){
      drillTypedB = ''; dAnsB.textContent = '_'; drillShake(dWrapB); return;
    }
    drillTypedB = next;
    dAnsB.textContent = next;
    dWrapB.classList.remove('wrong');
    if(next === cur.ansB){ dWrapB.classList.add('correct'); drillCorrect(); }
  }
}

function drillHandleBackspace(){
  if(drillLocked || !drillRunning || drillDone) return;
  if(drillPhase === 'B' && drillTypedB.length){
    drillTypedB = drillTypedB.slice(0,-1);
    dAnsB.textContent = drillTypedB || '_';
    if(!drillTypedB) dWrapB.classList.remove('wrong');
  } else if(drillPhase === 'A' && drillTypedA.length){
    drillTypedA = drillTypedA.slice(0,-1);
    dAnsA.textContent = drillTypedA ? (drillIsApprox() ? rootsFmtApprox(drillTypedA) : drillTypedA) : '_';
    if(!drillTypedA) dWrapA.classList.remove('wrong');
  }
}

function drillCorrect(){
  drillLocked = true;
  drillRep++;
  drillUpdateProg();
  dWrapA.classList.remove('wrong'); dWrapA.classList.add('correct');
  dWrapB.classList.remove('wrong'); dWrapB.classList.add('correct');
  drillTO = setTimeout(()=>{
    if(!drillRunning) return;
    if(drillRep >= drillReps) drillNextItem(); else drillSetQuestion();
  }, 320);
}

function drillFinish(){
  drillDone = true;
  dRow.style.display = 'none';
  dInfo.textContent = `${drillItems.length} / ${drillItems.length}`;
  dProg.textContent = '';
  dMsg.textContent = '◆ tudo fixado';
  drillTO = setTimeout(()=>{ if(drillDone) drillShowPicker(); }, 2200);
}

// teclado — capture para ter prioridade
document.addEventListener('keydown', function(e){
  if(currentMode !== 'drill') return;
  if(!drillRunning){
    if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); return; }
    if(e.key === 'Enter'){ e.preventDefault(); drillStart(); return; }
    return; // deixa digitar no campo de repetições
  }
  if(e.key === 'Escape' || (drillDone && (e.key === ' ' || e.key === 'Enter'))){
    e.preventDefault(); stopDrill(); drillShowPicker(); return;
  }
  if(e.key === 'Backspace'){ e.preventDefault(); drillHandleBackspace(); return; }
  if(/^\d$/.test(e.key)){ e.preventDefault(); drillHandleDigit(e.key); return; }
}, true);

})();
