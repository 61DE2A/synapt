<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabuada · Pitágoras</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;overflow:hidden;}

:root{
  --ac:rgba(188,168,110,0.9);
  --ac2:rgba(188,168,110,0.18);
  --ac3:rgba(188,168,110,0.07);
  --ac4:rgba(188,168,110,0.14);
  --ac5:rgba(188,168,110,0.04);
  --eye-s:rgba(230,215,180,0.35);
  --txt-dim:rgba(220,225,215,0.42);
  --txt-on:rgba(230,225,215,0.92);
  --txt-info:rgba(230,225,215,0.82);
  --correct:rgba(122,184,122,1);
  --wrong:#c86060;
}

#root{position:fixed;inset:0;background:#0a0a0a;overflow:hidden;display:flex;flex-direction:column;}

#rw{width:100vw;height:100vh;position:absolute;top:0;left:0;z-index:0;overflow:hidden;background:#0a0a0a;}
#rc{display:block;position:absolute;top:0;left:0;}
#river-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(6,6,8,0.62);}
#grain-fine{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  opacity:0.028;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;animation:grainA 6s steps(1) infinite;
}
@keyframes grainA{
  0%{background-position:0 0}12%{background-position:-31px 19px}25%{background-position:67px -24px}
  37%{background-position:-12px 43px}50%{background-position:54px 7px}62%{background-position:-61px -18px}
  75%{background-position:28px 57px}87%{background-position:-47px 33px}100%{background-position:0 0}
}

#ui{position:relative;z-index:10;display:flex;flex-direction:column;width:100%;height:100%;padding:10px 14px 8px;gap:6px;}
#topbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-shrink:0;height:30px;}
#infoEl{font-family:var(--font);font-size:20px;color:var(--txt-info);letter-spacing:0.030em;transition:color .3s;}
#eyeBtn{width:30px;height:30px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(220,215,200,0.22);border-radius:6px;background:transparent;transition:border-color .25s;}
#eyeBtn:hover{border-color:var(--ac);}
#eyeBtn svg{width:13px;height:13px;fill:none;stroke:var(--eye-s);stroke-width:1.5;transition:stroke .25s;}
#eyeBtn:hover svg,#eyeBtn.active svg{stroke:var(--ac);}
#eyeBtn.active{border-color:var(--ac);}

/* hold-to-autofill ring */
#eyeBtn{position:relative;overflow:hidden;}
#eyeHoldRing{
  position:absolute;inset:-1px;border-radius:6px;
  pointer-events:none;
  background:conic-gradient(var(--ac) 0deg, transparent 0deg);
  opacity:0;transition:opacity .15s;
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));
}
#eyeBtn.holding #eyeHoldRing{opacity:1;}

#tableWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;}
table{border-collapse:separate;border-spacing:2px;table-layout:fixed;}
th,td{text-align:center;padding:0;overflow:hidden;}

th.hdr,td.hdr-row{
  font-family:var(--font);color:var(--ac);
  letter-spacing:0.020em;background:var(--ac3);font-weight:600;
  cursor:pointer;transition:background .2s,color .4s;border-radius:5px;
}
th.hdr:hover,td.hdr-row:hover{background:var(--ac2);}
th.hdr.sel,td.hdr-row.sel{background:var(--ac2);}

td.corner{background:var(--ac5);font-family:var(--font);color:var(--ac);border-radius:5px;opacity:0.5;}
td.cell{background:rgba(255,255,255,0.025);transition:background .12s;border-radius:6px;}
td.cell.in-row,td.cell.in-col{background:var(--ac5);}
td.cell.active{background:var(--ac4);outline:1px solid var(--ac);outline-offset:-1px;}

td.cell input{
  width:100%;height:100%;background:transparent;border:none;outline:none;
  font-family:var(--font);text-align:center;color:var(--txt-dim);
  padding:0;-webkit-appearance:none;cursor:default;caret-color:var(--ac);display:block;border-radius:6px;
}
td.cell.active input{color:var(--txt-on);cursor:text;}
td.cell.st-correct input{color:var(--correct)!important;cursor:default;}
td.cell.st-wrong input{color:var(--wrong)!important;}

#seasonToast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);
  font-family:var(--font);font-size:17px;letter-spacing:0.045em;
  color:var(--ac);border:1px solid var(--ac2);background:rgba(10,10,10,0.82);
  padding:5px 14px;border-radius:20px;pointer-events:none;
  opacity:0;transition:opacity .4s,transform .4s;z-index:100;
}
#seasonToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-4px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
td.cell.shaking{animation:shake 0.38s ease;}

/* ═══════════════════════════════════
   BLOOM MOMENT
═══════════════════════════════════ */

/* Bloom overlay canvas — sits between river and ui */
#bloomCanvas{
  position:absolute;top:0;left:0;z-index:5;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.8s ease;
}
#bloomCanvas.visible{opacity:1;}

/* Table bloom states */
#tableWrap{transition:opacity 0.6s ease, transform 0.6s ease;}
#tableWrap.bloom-fade{
  opacity:0;
  transform:scale(0.97);
}

/* Table tremble keyframes */
@keyframes tableBloomTremble{
  0%  {transform:translate(0,0) rotate(0deg);}
  8%  {transform:translate(-3px,1px) rotate(-0.4deg);}
  16% {transform:translate(3px,-2px) rotate(0.5deg);}
  24% {transform:translate(-4px,2px) rotate(-0.6deg);}
  32% {transform:translate(4px,-1px) rotate(0.4deg);}
  40% {transform:translate(-3px,3px) rotate(-0.3deg);}
  48% {transform:translate(3px,-3px) rotate(0.5deg);}
  56% {transform:translate(-2px,2px) rotate(-0.4deg);}
  64% {transform:translate(2px,-1px) rotate(0.3deg);}
  72% {transform:translate(-1px,1px) rotate(-0.2deg);}
  82% {transform:translate(1px,-1px) rotate(0.15deg);}
  90% {transform:translate(-1px,0px) rotate(-0.1deg);}
  100%{transform:translate(0,0) rotate(0deg);}
}
#tableWrap.bloom-tremble{
  animation:tableBloomTremble 1.1s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
}

/* Topbar during bloom */
#topbar{transition:opacity 0.5s ease;}
#topbar.bloom-hide{opacity:0;pointer-events:none;}

/* Reset counter toast */
#resetToast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);
  font-family:var(--font);font-size:15px;letter-spacing:0.045em;
  color:var(--ac);border:1px solid var(--ac2);background:rgba(10,10,10,0.88);
  padding:4px 20px;border-radius:20px;pointer-events:none;
  opacity:0;transition:opacity .5s,transform .5s;z-index:200;
  white-space:nowrap;
}
#resetToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ═══════════════════════════════════
   SIDEBAR MENU
═══════════════════════════════════ */
#menuBtn{
  width:30px;height:30px;cursor:pointer;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:1px solid rgba(220,215,200,0.22);border-radius:6px;background:transparent;
  transition:border-color .25s;
}
#menuBtn:hover,#menuBtn.active{border-color:var(--ac);}
#menuBtn span{
  display:block;width:13px;height:1.5px;background:var(--eye-s);
  border-radius:2px;transition:background .25s,transform .3s,opacity .3s;
}
#menuBtn:hover span,#menuBtn.active span{background:var(--ac);}
#menuBtn.active span:nth-child(1){transform:translateY(5.5px) rotate(45deg);}
#menuBtn.active span:nth-child(2){opacity:0;transform:scaleX(0);}
#menuBtn.active span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg);}

#sidebar{
  position:fixed;top:0;left:0;bottom:0;width:220px;z-index:50;
  background:rgba(8,8,8,0.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--ac2);
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;padding:52px 0 24px;
  overflow-y:auto;overflow-x:hidden;
}
#sidebar.open{transform:translateX(0);}

#sidebarTitle{
  font-family:var(--font);font-size:13px;letter-spacing:0.080em;
  color:var(--ac);padding:0 18px 12px;
  border-bottom:1px solid var(--ac2);margin-bottom:8px;opacity:0.7;
}

.sb-section{
  padding:10px 18px 6px;
}
.sb-label{
  font-family:var(--font);font-size:11px;letter-spacing:0.070em;
  color:var(--ac);opacity:0.5;margin-bottom:8px;display:block;
}

/* Mode buttons */
.sb-mode-btn{
  width:100%;background:var(--ac3);border:1px solid var(--ac2);
  border-radius:6px;padding:8px 12px;cursor:pointer;margin-bottom:6px;
  font-family:var(--font);font-size:15px;letter-spacing:0.025em;
  color:var(--txt-dim);text-align:left;transition:background .2s,border-color .2s,color .2s;
  display:flex;align-items:center;gap:8px;
}
.sb-mode-btn:hover{background:var(--ac2);border-color:var(--ac);color:var(--txt-on);}
.sb-mode-btn.active{background:var(--ac2);border-color:var(--ac);color:var(--ac);}
.sb-mode-btn .sb-icon{font-size:18px;width:16px;text-align:center;flex-shrink:0;}

/* Range display */
#rangeDisplay{
  font-family:var(--font);font-size:15px;color:var(--txt-info);
  letter-spacing:0.025em;display:flex;align-items:center;gap:6px;
}
.range-num{
  font-size:20px;color:var(--ac);font-weight:600;
  min-width:24px;text-align:center;transition:color .2s;
}
.sb-range-btn{
  width:22px;height:22px;background:var(--ac3);border:1px solid var(--ac2);
  border-radius:4px;cursor:pointer;font-family:var(--font);
  font-size:20px;color:var(--txt-dim);display:flex;align-items:center;justify-content:center;
  transition:all .2s;line-height:1;
}
.sb-range-btn:hover{background:var(--ac2);border-color:var(--ac);color:var(--ac);}




/* Quiz UI — texto puro flutuando, sem bloquear cliques */
#quizOverlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .35s;
}
#quizOverlay.visible{opacity:1;}

#quizLine{
  display:flex;align-items:baseline;gap:0.35em;
  font-family:var(--font);font-size:clamp(24px,5vw,42px);
  letter-spacing:0.025em;
  text-shadow:0 0 40px rgba(255,255,255,0.9),0 2px 8px rgba(255,255,255,0.8);
}
#quizQuestion{color:var(--txt-on);user-select:none;}
#quizAnswer{color:var(--ac);min-width:1.2em;transition:color .15s;}
#quizAnswer.correct{color:var(--correct);}
#quizAnswer.wrong{color:var(--wrong);}

#quizStreak{
  font-family:var(--font);font-size:14px;letter-spacing:0.070em;
  color:var(--txt-dim);margin-top:18px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}

@keyframes quizFadeSlide{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}
#quizLine.anim{animation:quizFadeSlide .22s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes quizShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}
  80%{transform:translateX(3px);}
}
#quizAnswer.shaking{animation:quizShake .35s ease;}

/* ═══════════════════════════════════
   ROOTS MODE
═══════════════════════════════════ */
#rootsOverlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .35s;
  font-family:var(--font);
}
#rootsOverlay.visible{opacity:1;}
#rootsOverlay.visible > *{pointer-events:auto;}

#rootsTimer{
  font-size:17px;letter-spacing:0.070em;color:var(--txt-dim);
  margin-bottom:18px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}
#rootsProgress{
  font-size:14px;letter-spacing:0.070em;color:var(--txt-dim);
  margin-top:14px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}
#rootsPR{
  font-size:14px;letter-spacing:0.050em;color:var(--txt-dim);
  margin-top:8px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);min-height:1.2em;
}

/* The question line */
#rootsLine{
  display:flex;align-items:baseline;gap:0.25em;
  font-size:clamp(24px,5vw,42px);letter-spacing:0.020em;
  text-shadow:0 0 40px rgba(255,255,255,0.9),0 2px 8px rgba(255,255,255,0.8);
  position:relative;
}
@keyframes rootsFadeSlide{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}
#rootsLine.anim{animation:rootsFadeSlide .22s cubic-bezier(.22,1,.36,1) forwards;}

.roots-q{color:var(--txt-on);user-select:none;}
/* two-part answer: coefficient + radicand */
.roots-ans-wrap{display:inline-flex;align-items:baseline;gap:0.15em;color:var(--ac);}
.roots-ans-a{min-width:1em;transition:color .15s;} /* coefficient or full answer */
.roots-sym{color:var(--txt-dim);font-size:0.7em;opacity:0.7;} /* √ or ∛ between parts */
.roots-ans-b{min-width:1em;transition:color .15s;} /* radicand */
.roots-ans-wrap.correct .roots-ans-a,
.roots-ans-wrap.correct .roots-ans-b{color:var(--correct);}
.roots-ans-wrap.wrong .roots-ans-a,
.roots-ans-wrap.wrong .roots-ans-b{color:var(--wrong);}
@keyframes rootsShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(3px);}
}
.roots-ans-wrap.shaking{animation:rootsShake .35s ease;}

/* tooltip on mode buttons */
.sb-mode-btn{position:relative;}
.sb-tip{
  position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
  background:rgba(8,8,8,0.96);border:1px solid var(--ac2);border-radius:8px;
  padding:10px 14px;width:200px;pointer-events:none;
  font-family:var(--font);font-size:14px;color:var(--txt-info);
  line-height:1.7;letter-spacing:0.015em;
  opacity:0;transition:opacity .2s;z-index:200;white-space:pre-line;
}
.sb-mode-btn:hover .sb-tip{opacity:1;}

/* ═══════════════════════════════════
   FORMULAS MODE
═══════════════════════════════════ */
#fmlOverlay{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .35s;
  font-family:var(--font);
  gap:0;
}
#fmlOverlay.visible{opacity:1;}

#fmlTimer{
  font-size:17px;letter-spacing:0.070em;color:var(--txt-dim);
  margin-bottom:16px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}
#fmlSection{
  font-size:13px;letter-spacing:0.095em;color:var(--ac);
  opacity:0.55;margin-bottom:6px;
  text-shadow:0 1px 6px rgba(255,255,255,0.9);
}
#fmlPrompt{
  font-size:clamp(13px,2.5vw,18px);letter-spacing:0.035em;
  color:var(--txt-dim);margin-bottom:22px;text-align:center;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}

/* ── Visual math rendering ────────────── */
#fmlLine{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  text-shadow:0 0 40px rgba(255,255,255,0.9),0 2px 8px rgba(255,255,255,0.8);
  font-size:clamp(18px,4vw,32px);
}
@keyframes fmlFadeSlide{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}
#fmlLine.anim{animation:fmlFadeSlide .22s cubic-bezier(.22,1,.36,1) forwards;}

/* phase row wraps the whole visual expression */
.fml-phase-row{
  display:inline-flex;align-items:center;gap:0.25em;
  position:relative;
}
.fml-phase-label{
  color:var(--txt-dim);font-size:0.5em;letter-spacing:0.050em;
  opacity:0.45;margin-right:6px;align-self:center;
}

/* tokens: each is a span coloured by state */
.fml-tok{
  display:inline-flex;align-items:center;
  color:var(--txt-dim);opacity:0.18;
  transition:color .12s, opacity .12s;
  white-space:pre;
}
.fml-tok.done { color:var(--correct); opacity:1; }
.fml-tok.active{ color:var(--ac);     opacity:1; }
.fml-tok.wrong { color:var(--wrong);  opacity:1; }

/* shake on wrap level */
@keyframes fmlShake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);}40%{transform:translateX(5px);}
  60%{transform:translateX(-4px);}80%{transform:translateX(3px);}
}
.fml-phase-row.shaking{animation:fmlShake .35s ease;}

/* ── Fraction ──────────── */
.fml-frac{
  display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:middle;margin:0 0.1em;line-height:1.1;
}
.fml-num{
  border-bottom:1.5px solid currentColor;
  padding:0 0.15em 1px;line-height:1.2;
  display:flex;align-items:center;justify-content:center;gap:0.1em;
}
.fml-den{
  padding:1px 0.15em 0;line-height:1.2;
  display:flex;align-items:center;justify-content:center;gap:0.1em;
}

/* ── Square root ───────── */
.fml-sqrt{
  display:inline-flex;align-items:center;
  vertical-align:middle;
}
.fml-sqrt-sign{
  font-size:1.2em;line-height:1;margin-right:1px;
  transform:scaleY(1.1);display:inline-block;
}
.fml-sqrt-body{
  border-top:1.5px solid currentColor;
  padding:0 0.12em 0;
  display:inline-flex;align-items:center;gap:0.05em;
}

/* ── Cube root ─────────── */
.fml-cbrt-idx{
  font-size:0.5em;vertical-align:super;margin-right:-2px;line-height:1;
}

/* ── Superscript / subscript ── */
.fml-sup{font-size:0.58em;vertical-align:super;line-height:1;}
.fml-sub{font-size:0.58em;vertical-align:sub;line-height:1;}

/* ── Plus-minus ─────────── */
.fml-pm{letter-spacing:-0.02em;}

/* cursor */
.fml-cursor{
  display:inline-block;width:2px;height:0.9em;
  background:var(--ac);margin-left:2px;vertical-align:middle;
  animation:fmlBlink 1s step-end infinite;opacity:0.8;
}
@keyframes fmlBlink{0%,100%{opacity:0.8;}50%{opacity:0;}}

/* hint — full visual formula dimmed */
#fmlHint{
  margin-top:14px;min-height:1.5em;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(14px,3vw,22px);
  opacity:0.22;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
  pointer-events:none;
}

#fmlProgress{
  font-size:14px;letter-spacing:0.070em;color:var(--txt-dim);
  margin-top:16px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);
}
#fmlPR{
  font-size:14px;letter-spacing:0.050em;color:var(--txt-dim);
  margin-top:8px;
  text-shadow:0 1px 6px rgba(255,255,255,0.8);min-height:1.2em;
}

/* finish overlay */
#fmlFinishOverlay{
  position:fixed;inset:0;z-index:31;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .6s;
  font-family:var(--font);
  background:rgba(255,255,255,0.62);
}

/* ═══ NEON DARK ═══ */
:root{
  --font:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace;
  --txt-dim:rgba(190,205,240,.55);
  --txt-on:#f2f6ff;
  --txt-info:rgba(220,230,255,.88);
  --eye-s:var(--ac);
  --correct:#00ff9c;
  --wrong:#ff2e63;
  --card:rgba(7,9,20,.66);
}
html,body{font-family:var(--font);background:#04050c;color:var(--txt-on);}
#root,#rw{background:#04050c;}
#river-overlay{
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),

<script>
(() => {
  'use strict';
  const CODE = '6a02';
  const IDLE_MS = 10 * 60 * 1000;
  let buf = '', last = Date.now();
  const locked = () => !document.body.classList.contains('unlocked');
  function lock() {
    document.body.classList.remove('unlocked');
    buf = '';
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function unlock() {
    document.body.classList.add('unlocked');
    buf = ''; last = Date.now();
  }
  window.addEventListener('keydown', e => {
    if (locked()) {
      if (e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(e.key)) return;
      e.preventDefault(); e.stopImmediatePropagation();
      if (e.key && e.key.length === 1) {
        buf = (buf + e.key.toLowerCase()).slice(-CODE.length);
        if (buf === CODE) unlock();
      }
    } else {
      last = Date.now();
    }
  }, true);
  ['mousemove','mousedown','wheel','touchstart','scroll','input','click'].forEach(ev =>
    window.addEventListener(ev, () => { if (!locked()) last = Date.now(); }, { capture: true, passive: true })
  );
  setInterval(() => { if (!locked() && Date.now() - last >= IDLE_MS) lock(); }, 5000);
})();

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════
// GALAXY BACKGROUND — nebulosa ASCII + céu estrelado
// ═══════════════════════════════════════════════════════════════
const MONO_BG='"SF Mono",Monaco,Inconsolata,"Fira Code","Courier New",monospace';

// Paletas neon: duas nebulosas (do escuro ao brilhante) + cores das estrelas
// (as primeiras da lista são as mais comuns: branco/pálido; verde/rosa são raros)
const SEASONS={
  spring:{name:'ciano',accent:[0,240,255],
    neb1:['#0a4a8a','#0b6fb8','#0aa0d8','#00c8f0'],neb2:['#4a1580','#7a1fa8','#b020c8','#e030d8'],
    star:['#ffffff','#9ff8ff','#ffe600','#ff2bd6','#00ffa3'],bgBase:'#02050c',particleColor:'#9ff8ff'},
  summer:{name:'magenta',accent:[255,45,200],
    neb1:['#5a0f5a','#8a1478','#c01a96','#ff2bd6'],neb2:['#2a1480','#3a2ad0','#5a50ff','#00c8ff'],
    star:['#ffffff','#ffd0f4','#ffe600','#00f0ff','#39ff14'],bgBase:'#07030c',particleColor:'#ffd0f4'},
  autumn:{name:'âmbar',accent:[255,150,20],
    neb1:['#6a2a05','#a04008','#e06010','#ff9100'],neb2:['#6a0a3a','#a01058','#e01a70','#ff2e63'],
    star:['#ffffff','#ffe9b0','#ffe600','#00f0ff','#ff2e63'],bgBase:'#080402',particleColor:'#ffe9b0'},
  winter:{name:'violeta',accent:[150,100,255],
    neb1:['#2a1480','#4a2ad8','#7a50ff','#a880ff'],neb2:['#0a5a5a','#0a8a80','#00c8b0','#00ffa3'],
    star:['#ffffff','#d8c8ff','#00f0ff','#ff2bd6','#b6ff00'],bgBase:'#04030c',particleColor:'#d8c8ff'}
};
const SEASON_ORDER=['spring','summer','autumn','winter'];
let currentSeason='spring',targetSeason='spring',seasonBlend=1.0;
const MIN_SEASON_MS=3*60*1000,MAX_SEASON_MS=8*60*1000;
let nextSeasonChange=Date.now()+MIN_SEASON_MS+Math.random()*(MAX_SEASON_MS-MIN_SEASON_MS);

function lerpColor(c1,c2,t){
  function parse(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
  function hex(v){return Math.round(v).toString(16).padStart(2,'0');}
  const a=parse(c1),b=parse(c2);
  return'#'+hex(a[0]+(b[0]-a[0])*t)+hex(a[1]+(b[1]-a[1])*t)+hex(a[2]+(b[2]-a[2])*t);
}

function getBlendedSeason(){
  const cs=SEASONS[currentSeason],ts=SEASONS[targetSeason];
  if(seasonBlend>=1)return cs;
  const t=seasonBlend;
  const blendArr=(a,b)=>a.map((c,i)=>lerpColor(c,b[i]||b[b.length-1],t));
  const blendRGB=(a,b)=>[Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];
  return{
    name:t>0.5?ts.name:cs.name,
    accent:blendRGB(cs.accent,ts.accent),
    neb1:blendArr(cs.neb1,ts.neb1),neb2:blendArr(cs.neb2,ts.neb2),star:blendArr(cs.star,ts.star),
    bgBase:lerpColor(cs.bgBase,ts.bgBase,t),
    particleColor:lerpColor(cs.particleColor,ts.particleColor,t)
  };
}

let seasonToastTimer=null;
function changeSeason(name){
  currentSeason=targetSeason;seasonBlend=1.0;targetSeason=name;seasonBlend=0.0;
  nextSeasonChange=Date.now()+MIN_SEASON_MS+Math.random()*(MAX_SEASON_MS-MIN_SEASON_MS);
  const toast=document.getElementById('seasonToast');
  const S=SEASONS[name];
  toast.textContent=S.name;
  toast.classList.add('show');
  if(seasonToastTimer)clearTimeout(seasonToastTimer);
  seasonToastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}
function changeSeasonNext(){
  const idx=SEASON_ORDER.indexOf(targetSeason);
  changeSeason(SEASON_ORDER[(idx+1)%4]);
}
function applySeasonToCSS(S){
  const[r,g,b]=S.accent,root=document.documentElement,d=k=>Math.round(k*0.72);
  root.style.setProperty('--ac',`rgb(${r},${g},${b})`);
  root.style.setProperty('--acd',`rgb(${d(r)},${d(g)},${d(b)})`);
  root.style.setProperty('--eye-s',`rgb(${d(r)},${d(g)},${d(b)})`);
  root.style.setProperty('--ac2',`rgba(${r},${g},${b},0.22)`);
  root.style.setProperty('--ac3',`rgba(${r},${g},${b},0.10)`);
  root.style.setProperty('--ac4',`rgba(${r},${g},${b},0.22)`);
  root.style.setProperty('--ac5',`rgba(${r},${g},${b},0.09)`);
  document.body.style.background=S.bgBase;
}
function pickColor(arr,lp){return arr[Math.max(0,Math.min(Math.floor(lp*arr.length),arr.length-1))];}

// ── ruído simplex-ish (mesmo do fundo antigo) ──
function fade(t){return t*t*t*(t*(6*t-15)+10);}
function grad(h,x,y){const a=3&h,r=a<2?x:y,i=a<2?y:x;return((1&a)?-r:r)+((2&a)?-i:i);}
const perm=(function(seed){let p=[];for(let i=0;i<256;i++)p[i]=i;let s=seed;for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[p[i],p[j]]=[p[j],p[i]];}return[...p,...p];})(42);
function snoise(x,y){const xi=Math.floor(x)&255,yi=Math.floor(y)&255;const xf=x-Math.floor(x),yf=y-Math.floor(y);const u=fade(xf),v=fade(yf);const aa=perm[perm[xi]+yi],ab=perm[perm[xi]+yi+1],ba=perm[perm[xi+1]+yi],bb=perm[perm[xi+1]+yi+1];const r1=grad(aa,xf,yf)+(grad(ba,xf-1,yf)-grad(aa,xf,yf))*u;const r2=grad(ab,xf,yf-1)+(grad(bb,xf-1,yf-1)-grad(ab,xf,yf-1))*u;return r1+(r2-r1)*v;}

// ── canvas / grade de caracteres ──
const canvas=document.getElementById('rc');
const DPR=Math.min(window.devicePixelRatio||1,2);
let cW=window.innerWidth,cH=window.innerHeight;
const ctx=canvas.getContext('2d',{alpha:false});
const FONT_PX=14*DPR;
const CHAR_W=(25/3)*DPR;
const LINE_H=(67/3)*DPR;
let COLS=0,VISIBLE_ROWS=0,TILE_ROWS=0,TILE=[],stars=[];
let bgFrame=0;

// faixa diagonal da "Via Láctea": concentra nebulosa e estrelas
function bandAt(c,r){
  const th=-0.42;
  const px=c*CHAR_W-canvas.width/2,py=r*LINE_H-canvas.height/2;
  const dist=Math.abs(px*Math.sin(th)-py*Math.cos(th))/canvas.height;
  return Math.exp(-(dist*dist)/(2*0.2*0.2));
}

const NEB_RAMP=['.',',',':','+','*'];

function updateTile(f){
  const t=f*0.0008;
  for(let r=0;r<TILE_ROWS;r++){
    const row=TILE[r];
    for(let c=0;c<COLS;c++){
      const cell=row[c];
      const n=snoise(c*0.03+t,r*0.075-t*0.5)*0.7+snoise(c*0.09-t*1.5,r*0.22)*0.3;
      const d=Math.max(0,Math.min(1,(0.5+0.5*n+0.5*cell.band-0.67)*1.7));
      if(d<0.1||cell.j<0.18*(1-d)+0.12){cell.ch=' ';cell.op=0;continue;}
      cell.d=d;
      const ci=Math.floor(d*NEB_RAMP.length+(cell.j-0.5)*1.6);
      cell.ch=NEB_RAMP[Math.max(0,Math.min(NEB_RAMP.length-1,ci))];
      cell.op=0.1+0.36*d;
      cell.h=0.5+0.5*snoise(c*0.018+40-t*0.7,r*0.045+t*0.4);
    }
  }
}

// ── estrelas: 3 camadas com parallax, brilho piscando ──
function buildStars(){
  stars=[];
  const k=COLS*VISIBLE_ROWS;
  const spec=[
    {n:Math.round(k*0.012), chars:['.','·','.',"'"],      scale:0.75,base:0.25,speed:0.003,tw:[0.010,0.030]},
    {n:Math.round(k*0.005), chars:['+','·','*','+'],      scale:1.0, base:0.35,speed:0.007,tw:[0.020,0.050]},
    {n:Math.round(k*0.0018),chars:['✦','✧','+','*','✦'],  scale:1.2, base:0.45,speed:0.012,tw:[0.030,0.070]}
  ];
  spec.forEach((L,li)=>{
    for(let i=0;i<L.n;i++){
      let c,r,tries=0;
      do{c=Math.random()*COLS;r=Math.random()*VISIBLE_ROWS;tries++;}
      while(tries<6&&Math.random()>0.35+0.65*bandAt(c,r));
      const chroma=li===1&&Math.random()<0.18;
      stars.push({layer:li,x:c,y:r,
        vx:-L.speed*(0.7+Math.random()*0.6),vy:L.speed*0.25*(0.7+Math.random()*0.6),
        ch:chroma?'+':L.chars[Math.floor(Math.random()*L.chars.length)],
        scale:L.scale,base:L.base*(0.6+Math.random()*0.8),
        ph:Math.random()*6.283,ts:L.tw[0]+Math.random()*(L.tw[1]-L.tw[0]),
        u:Math.pow(Math.random(),1.8),chroma,glow:li===2});
    }
  });
}
function updateStars(){
  for(const s of stars){
    s.x+=s.vx;s.y+=s.vy;s.ph+=s.ts;
    if(s.x<-2){s.x=COLS+1;s.y=Math.random()*VISIBLE_ROWS;}
    if(s.y>VISIBLE_ROWS+1){s.y=-1;s.x=Math.random()*COLS;}
  }
}
function renderStars(S){
  ctx.textBaseline='top';
  let lastLayer=-1;
  for(const s of stars){
    if(s.glow)continue;
    if(s.layer!==lastLayer){ctx.font=`${Math.round(FONT_PX*s.scale)}px ${MONO_BG}`;lastLayer=s.layer;}
    const tw=0.5+0.5*Math.sin(s.ph),a=s.base+(1-s.base)*tw;
    const px=s.x*CHAR_W,py=s.y*LINE_H;
    if(s.chroma){
      // "+" com separação cromática rosa/azul
      ctx.globalAlpha=a*0.9;
      ctx.fillStyle='#ff2bd6';ctx.fillText('+',px-1.3*DPR,py);
      ctx.fillStyle='#00f0ff';ctx.fillText('+',px+1.3*DPR,py);
    } else {
      ctx.globalAlpha=a;ctx.fillStyle=pickColor(S.star,s.u);ctx.fillText(s.ch,px,py);
    }
  }
  // estrelas grandes com brilho (glow)
  ctx.font=`${Math.round(FONT_PX*1.2)}px ${MONO_BG}`;
  for(const s of stars){
    if(!s.glow)continue;
    const tw=0.5+0.5*Math.sin(s.ph),a=s.base+(1-s.base)*tw;
    const color=pickColor(S.star,s.u);
    ctx.globalAlpha=a;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=12*DPR;
    ctx.fillText(s.ch,s.x*CHAR_W,s.y*LINE_H);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

// ── estrelas cadentes ──
let comets=[];
const COMET_TRAIL=['/','/','*','·','.','.'];
function updateComets(){
  if(comets.length<1&&Math.random()<0.0012){
    comets.push({x:COLS*(0.3+Math.random()*0.7),y:-1+Math.random()*VISIBLE_ROWS*0.35,
      vx:-(0.9+Math.random()*0.6),vy:0.28+Math.random()*0.2});
  }
  comets=comets.filter(m=>{m.x+=m.vx;m.y+=m.vy;return m.x>-16&&m.y<VISIBLE_ROWS+2;});
}
function renderComets(S){
  if(!comets.length)return;
  ctx.font=`${Math.round(FONT_PX*1.1)}px ${MONO_BG}`;ctx.textBaseline='top';
  for(const m of comets){
    for(let i=COMET_TRAIL.length*2-1;i>=0;i--){
      const px=(m.x-m.vx*i*0.9)*CHAR_W,py=(m.y-m.vy*i*0.9)*LINE_H;
      const a=Math.pow(1-i/(COMET_TRAIL.length*2),1.6);
      ctx.globalAlpha=a*0.85;ctx.fillStyle=S.particleColor;
      ctx.fillText(i===0?'✦':COMET_TRAIL[Math.min(COMET_TRAIL.length-1,Math.floor(i/2))],px,py);
    }
    ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.shadowColor=S.particleColor;ctx.shadowBlur=16*DPR;
    ctx.fillText('✦',m.x*CHAR_W,m.y*LINE_H);ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

// ── estrelas do "bloom" (explosão de estrelas ao completar a tabela) ──
let bloomOverrides=[];
function renderBloomStars(S){
  if(!bloomOverrides.length)return;
  ctx.font=`${Math.round(FONT_PX*1.1)}px ${MONO_BG}`;ctx.textBaseline='top';
  for(let i=0;i<bloomOverrides.length;i++){
    const b=bloomOverrides[i],age=bgFrame-b.t0;
    if(age<0)continue;
    const a=Math.min(1,age/25)*(0.55+0.45*Math.sin(b.ph+age*0.08));
    const color=pickColor(S.star,b.u);
    ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=color;
    if(i<70){ctx.shadowColor=color;ctx.shadowBlur=12*DPR;}else{ctx.shadowBlur=0;}
    ctx.fillText(b.ch,b.c*CHAR_W,b.r*LINE_H);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

let lastCSSUpdate=0;
function renderBG(){
  const S=getBlendedSeason();
  const now=Date.now();
  if(now-lastCSSUpdate>500){applySeasonToCSS(S);lastCSSUpdate=now;}
  ctx.globalAlpha=1;ctx.fillStyle=S.bgBase;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=`${FONT_PX}px ${MONO_BG}`;ctx.textBaseline='top';
  for(let r=0;r<TILE_ROWS;r++){
    const row=TILE[r],py=r*LINE_H;
    for(let c=0;c<COLS;c++){
      const cell=row[c];
      if(cell.op<=0)continue;
      ctx.globalAlpha=cell.op;
      ctx.fillStyle=cell.h>0.5?pickColor(S.neb2,cell.d):pickColor(S.neb1,cell.d);
      ctx.fillText(cell.ch,c*CHAR_W,py);
    }
  }
  ctx.globalAlpha=1;
  renderStars(S);
  renderComets(S);
  renderBloomStars(S);
}

function buildGrid(){
  cW=window.innerWidth;cH=window.innerHeight;
  canvas.width=Math.round(cW*DPR);canvas.height=Math.round(cH*DPR);
  canvas.style.width=cW+'px';canvas.style.height=cH+'px';
  COLS=Math.ceil(canvas.width/CHAR_W)+2;
  VISIBLE_ROWS=Math.ceil(canvas.height/LINE_H)+2;
  TILE_ROWS=VISIBLE_ROWS;
  TILE=[];
  for(let r=0;r<TILE_ROWS;r++){
    const row=[];
    for(let c=0;c<COLS;c++)row.push({ch:' ',d:0,op:0,h:0,j:Math.random(),band:bandAt(c,r)});
    TILE.push(row);
  }
  buildStars();
  updateTile(bgFrame);
}

let lastTs=0;
function loop(ts){
  if(!document.body.classList.contains('unlocked')){lastTs=0;requestAnimationFrame(loop);return;}
  if(!lastTs)lastTs=ts;const dt=Math.min(ts-lastTs,50);lastTs=ts;
  bgFrame++;
  if(seasonBlend<1){seasonBlend=Math.min(1,seasonBlend+(dt/16.67)*0.003);if(seasonBlend>=1){currentSeason=targetSeason;seasonBlend=1;}}
  if(Date.now()>nextSeasonChange){const idx=SEASON_ORDER.indexOf(currentSeason);changeSeason(SEASON_ORDER[(idx+1)%4]);}
  if(bgFrame%3===0)updateTile(bgFrame);
  updateStars();updateComets();renderBG();
  if(bloomState.active) renderBloom(ts);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{
  buildGrid();
  const bc=document.getElementById('bloomCanvas');
  bc.width=cW;bc.height=cH;
  rebuildTable();
});
buildGrid();
applySeasonToCSS(SEASONS[currentSeason]);
requestAnimationFrame(loop);

// ═══════════════════════════════════════════════════════════════

// bloomCanvas existe no DOM mas nunca é usado — bloom acontece no tile do fundo
const bloomCanvas=document.getElementById('bloomCanvas');

// ─── BLOOM STATE ──────────────────────────────────────────────
const bloomState={
  active:false,
  phase:'off', // 'off' | 'burst' | 'settle' | 'done'
  startTs:0,
  _settleStart:0,
  _settleApplied:false,
  burstDuration:7000,
  settleDuration:1800,
};

// Estrelas do bloom (desenhadas por renderBloomStars no motor do fundo)
const BLOOM_CH=['✦','+','✧','*','✦','+','·'];
function floodBloomIntoTile(count){
  for(let i=0;i<count;i++){
    bloomOverrides.push({
      r:Math.floor(Math.random()*TILE_ROWS),c:Math.floor(Math.random()*COLS),
      ch:BLOOM_CH[Math.floor(Math.random()*BLOOM_CH.length)],
      u:Math.pow(Math.random(),1.4),ph:Math.random()*6.283,
      t0:bgFrame+Math.floor(Math.random()*40)
    });
  }
}
function clearBloomOverrides(){ bloomOverrides=[]; }

function triggerBloom(){
  if(bloomState.active) return;
  bloomState.active=true;
  bloomState.phase='burst';
  bloomState.startTs=0;
  bloomState._settleApplied=false;
  bloomOverrides=[];

  // Flood esparso — flores aparecem sem sobrepor demais
  const total=TILE_ROWS*COLS;
  floodBloomIntoTile(Math.floor(total*0.04));
  setTimeout(()=>{ if(bloomState.phase==='burst') floodBloomIntoTile(Math.floor(total*0.03)); },2000);
  setTimeout(()=>{ if(bloomState.phase==='burst') floodBloomIntoTile(Math.floor(total*0.025)); },4000);

  document.getElementById('topbar').classList.add('bloom-hide');
}

function renderBloom(ts){
  if(!bloomState.startTs) bloomState.startTs=ts;
  const elapsed=ts-bloomState.startTs;

  if(bloomState.phase==='burst'){
    if(elapsed>bloomState.burstDuration){
      bloomState.phase='settle';
      bloomState._settleStart=ts;
      triggerTableTremble();
    }
  }

  if(bloomState.phase==='settle'){
    const sElapsed=ts-bloomState._settleStart;
    if(sElapsed>bloomState.settleDuration){
      bloomState.phase='done';
      clearBloomOverrides();
      bloomState.active=false;
      showResetAndRebuild();
    }
  }
}

function triggerTableTremble(){
  const tw=document.getElementById('tableWrap');
  tw.classList.add('bloom-tremble');
  setTimeout(()=>{
    tw.classList.remove('bloom-tremble');
    tw.classList.add('bloom-fade');
  },1100);
}

function showResetAndRebuild(){
  const toast=document.getElementById('resetToast');
  const pr = window._lastPitResult;
  if(pr){
    const t = fmtMs(pr.ms);
    if(pr.result.isNew && pr.result.prev !== null){
      const delta = pr.result.prev - pr.ms;
      toast.textContent = `◆  ${t}  ▲${fmtMs(delta)}  ◆`;
    } else if(pr.result.isNew){
      toast.textContent = `◆  ${t}  primeiro recorde  ◆`;
    } else {
      toast.textContent = `◆  ${t}  recorde ${fmtMs(pr.result.prev)}  ◆`;
    }
    window._lastPitResult = null;
  } else {
    toast.textContent='◆  bloom  ◆';
  }
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3500);

  document.getElementById('topbar').classList.remove('bloom-hide');
  const tw=document.getElementById('tableWrap');
  tw.classList.remove('bloom-fade');
  tw.style.opacity='';
  tw.style.transform='';

  rebuildTable();
  pitTimerRunning = false; // reset for next round
}

// ═══════════════════════════════════════════════════════════════
let autoFillMode = false; // true quando * foi usada na sessão atual — não salva recordes
let tableAutoHandle = null;
let quizAutoHandle = null;
let N=10;
let eyeOn=false;
let activeCellKey=null;

let navMode='col';
let navFixed=null;

let states={}, inputEls={};

// ── Eye button: click = toggle hint | hold 4s = autofill ──────
(function(){
  const btn   = document.getElementById('eyeBtn');
  const ring  = document.getElementById('eyeHoldRing');
  const HOLD_MS = 4000;
  let holdStart  = 0;
  let holdRAF    = null;
  let didFire    = false;

  function cancelHold(){
    if(holdRAF){ cancelAnimationFrame(holdRAF); holdRAF=null; }
    btn.classList.remove('holding');
    ring.style.background = `conic-gradient(var(--ac) 0deg, transparent 0deg)`;
    holdStart = 0;
  }

  function tickHold(){
    const elapsed = Date.now() - holdStart;
    const frac    = Math.min(elapsed / HOLD_MS, 1);
    const deg     = frac * 360;
    ring.style.background = `conic-gradient(var(--ac) ${deg}deg, transparent ${deg}deg)`;
    if(frac >= 1){
      didFire = true;
      cancelHold();
      triggerAutoFill();
      return;
    }
    holdRAF = requestAnimationFrame(tickHold);
  }

  function triggerAutoFill(){
    autoFillMode = true;
    if(currentMode === 'table')                   tableAutoFill();
    else if(isQuizLike())                          quizAutoFill();
    else if(ROOT_MODES.includes(currentMode))     rootsAutoFill();
    else if(currentMode === 'formulas')           fmlAutoFill();
  }

  btn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    didFire   = false;
    holdStart = Date.now();
    btn.classList.add('holding');
    holdRAF   = requestAnimationFrame(tickHold);
    btn.setPointerCapture(e.pointerId);
  });

  btn.addEventListener('pointerup', function(e){
    const wasHolding = holdStart > 0;
    const elapsed    = Date.now() - holdStart;
    cancelHold();
    if(!didFire && wasHolding && elapsed < 600){
      // quick tap → toggle eye (only meaningful in table mode)
      eyeOn = !eyeOn;
      btn.classList.toggle('active', eyeOn);
      updateInfo();
    }
    didFire = false;
  });

  btn.addEventListener('pointerleave', function(){ cancelHold(); });
  btn.addEventListener('pointercancel', function(){ cancelHold(); });
})();

document.addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    changeSeasonNext();
    return;
  }

  // quiz mode tem seu próprio handler com capture=true
  if(isQuizLike() || currentMode==='drill') return;

  const active=document.activeElement;
  const isEditing=active&&active.tagName==='INPUT'&&!active.readOnly;

  if(!activeCellKey){
    if(e.key==='ArrowUp'){e.preventDefault();if(N===10)setRange(20);else if(N===20)setRange(30);return;}
    if(e.key==='ArrowDown'){e.preventDefault();if(N===30)setRange(20);else if(N===20)setRange(10);return;}
    return;
  }
  const[r,c]=activeCellKey.split('_').map(Number);

  if(e.key==='Enter'){
    e.preventDefault();
    if(isEditing){const inp=inputEls[activeCellKey];if(inp)commitAnswer(r,c,inp.value);}
    return;
  }
  if(e.key==='ArrowRight'){e.preventDefault();focusCell(r,c+1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();focusCell(r,c-1);return;}
  if(e.key==='ArrowDown'){e.preventDefault();focusCell(r+1,c);return;}
  if(e.key==='ArrowUp'){e.preventDefault();focusCell(r-1,c);return;}
});

document.addEventListener('input',function(e){
  if(!e.target.dataset||!e.target.dataset.r)return;
  const raw=e.target.value.replace(/\D/g,'');
  e.target.value=raw;
  if(!raw){updateInfo();return;}

  pitStartTimer(); // start on first keystroke

  const r=parseInt(e.target.dataset.r,10);
  const c=parseInt(e.target.dataset.c,10);
  const k=`${r}_${c}`;
  if(states[k]==='correct')return;

  const answer=String(r*c);
  const typed=raw;

  if(!answer.startsWith(typed)){
    const inp=inputEls[k];
    const td=inp?inp.closest('td'):null;
    if(!inp||!td)return;
    td.classList.add('st-wrong');
    void td.offsetWidth;
    td.classList.add('shaking');
    setTimeout(()=>{
      td.classList.remove('shaking','st-wrong');
      inp.value='';
      inp.readOnly=false;
      try{inp.focus();}catch(_){}
    },700);
  } else if(typed===answer){
    commitAnswer(r,c,typed);
  }
  updateInfo();
});

function colComplete(col){
  for(let r=1;r<=N;r++) if(states[`${r}_${col}`]!=='correct') return false;
  return true;
}
function rowComplete(row){
  for(let c=1;c<=N;c++) if(states[`${row}_${c}`]!=='correct') return false;
  return true;
}

// Check if ALL cells are complete
function tableComplete(){
  for(let r=1;r<=N;r++) for(let c=1;c<=N;c++) if(states[`${r}_${c}`]!=='correct') return false;
  return true;
}

function moveNext(r,c){
  if(navMode==='col'){
    let nr=r+1;
    while(nr<=N&&states[`${nr}_${c}`]==='correct') nr++;
    if(nr<=N){focusCell(nr,c);return;}
    let nc=c+1;
    while(nc<=N&&colComplete(nc)) nc++;
    if(nc<=N){
      navFixed=nc;updateHeaderSel();
      let startR=1;
      while(startR<=N&&states[`${startR}_${nc}`]==='correct') startR++;
      focusCell(startR,nc);
    }
  } else {
    let nc=c+1;
    while(nc<=N&&states[`${r}_${nc}`]==='correct') nc++;
    if(nc<=N){focusCell(r,nc);return;}
    let nr=r+1;
    while(nr<=N&&rowComplete(nr)) nr++;
    if(nr<=N){
      navFixed=nr;updateHeaderSel();
      let startC=1;
      while(startC<=N&&states[`${nr}_${startC}`]==='correct') startC++;
      focusCell(nr,startC);
    }
  }
}

function applyCorrect(r,c){
  const k=`${r}_${c}`;
  if(states[k]==='correct') return;
  const inp=inputEls[k];
  if(!inp) return;
  const td=inp.closest('td');
  if(!td) return;
  states[k]='correct';
  td.classList.remove('st-wrong','shaking','active','in-row','in-col');
  td.classList.add('st-correct');
  inp.value=String(r*c);
  inp.readOnly=true;
}

function commitAnswer(r,c,value){
  const k=`${r}_${c}`;
  if(states[k]==='correct') return;
  if(!value.trim()) return;
  const num=parseInt(value,10);
  if(isNaN(num)) return;

  const inp=inputEls[k];
  const td=inp?inp.closest('td'):null;
  if(!inp||!td) return;

  if(num===r*c){
    applyCorrect(r,c);
    if(r!==c) applyCorrect(c,r);

    eyeOn=false;
    document.getElementById('eyeBtn').classList.remove('active');

    // Check completion BEFORE navigating
    if(tableComplete()){
      activeCellKey=null;
      pitStopTimer();
      const pitMs = Date.now() - pitStartMs;
      const pitResult = saveRecord('pitagoras', N, pitMs);
      // store for bloom toast
      window._lastPitResult = { ms: pitMs, result: pitResult };
      // Small delay so the last correct cell visually registers
      setTimeout(()=>triggerBloom(),320);
      return;
    }

    moveNext(r,c);
  } else {
    td.classList.add('st-wrong');
    inp.value=String(num);
    void td.offsetWidth;
    td.classList.add('shaking');
    setTimeout(()=>{
      td.classList.remove('shaking','st-wrong');
      inp.value='';
      inp.readOnly=false;
      try{inp.focus();}catch(_){}
    },700);
  }
}

function focusCell(r,c){
  if(r<1||r>N||c<1||c>N) return;
  const k=`${r}_${c}`;
  if(states[k]==='correct') return;

  if(activeCellKey&&activeCellKey!==k){
    const pi=inputEls[activeCellKey];
    if(pi&&states[activeCellKey]!=='correct'){
      pi.readOnly=true;
      pi.value='';
    }
  }
  activeCellKey=k;
  refreshHighlight();

  const inp=inputEls[k];
  if(!inp) return;
  inp.readOnly=false;
  setTimeout(()=>{try{inp.focus();inp.select();}catch(_){}},10);
  updateInfo();
}

function refreshHighlight(){
  for(let r=1;r<=N;r++) for(let c=1;c<=N;c++){
    const inp=inputEls[`${r}_${c}`];if(!inp)continue;
    const td=inp.closest('td');
    if(td){td.classList.remove('in-row','in-col','active');}
  }
  if(!activeCellKey) return;
  const[ar,ac]=activeCellKey.split('_').map(Number);
  for(let r=1;r<=N;r++) for(let c=1;c<=N;c++){
    const inp=inputEls[`${r}_${c}`];if(!inp)continue;
    const td=inp.closest('td');if(!td)continue;
    if(states[`${r}_${c}`]==='correct') continue;
    if(r===ar&&c===ac) td.classList.add('active');
    else if(r===ar) td.classList.add('in-row');
    else if(c===ac) td.classList.add('in-col');
  }
}

function updateInfo(){
  const el=document.getElementById('infoEl');
  if(!activeCellKey){el.textContent='—';el.style.color='';return;}
  const[r,c]=activeCellKey.split('_').map(Number);
  if(eyeOn&&states[activeCellKey]!=='correct'){
    el.textContent=`${r} × ${c} = ${r*c}`;
    el.style.color='var(--ac)';
  } else {
    el.textContent=`${r} × ${c} = ?`;
    el.style.color='';
  }
}

function updateHeaderSel(){
  for(let c=1;c<=N;c++){
    const el=document.getElementById(`ch_${c}`);
    if(el) el.classList.toggle('sel',navMode==='col'&&navFixed===c);
  }
  for(let r=1;r<=N;r++){
    const el=document.getElementById(`rh_${r}`);
    if(el) el.classList.toggle('sel',navMode==='row'&&navFixed===r);
  }
}

function computeCellSize(){
  const tw=document.getElementById('tableWrap');
  const rect=tw.getBoundingClientRect();
  const avW=rect.width-12;
  const avH=rect.height-12;
  const side=Math.min(avW,avH);
  const available=side-(N+2)*2;
  const sz=Math.max(14,Math.min(Math.floor(available/(N+1)),64));
  return sz;
}

function rebuildTable(){
  autoFillMode = false;
  if(tableAutoHandle){ clearTimeout(tableAutoHandle); tableAutoHandle=null; }
  states={};inputEls={};activeCellKey=null;navMode='col';navFixed=null;
  const tw=document.getElementById('tableWrap');
  tw.innerHTML='';
  // Reset any leftover bloom classes
  tw.classList.remove('bloom-tremble','bloom-fade');
  tw.style.opacity='';
  tw.style.transform='';

  const sz=computeCellSize();
  const fs=Math.max(9,Math.min(26,Math.floor(sz*0.56)));
  const GAP=2;
  const tableSize=(sz+GAP)*(N+1)+GAP;

  const table=document.createElement('table');
  table.style.cssText=`width:${tableSize}px;height:${tableSize}px;min-width:${tableSize}px;min-height:${tableSize}px;`;

  const thead=document.createElement('thead');
  const trh=document.createElement('tr');
  trh.style.height=`${sz}px`;

  const corner=document.createElement('td');
  corner.className='corner';corner.textContent='×';
  corner.style.cssText=`width:${sz}px;height:${sz}px;font-size:${fs}px;`;
  trh.appendChild(corner);

  for(let c=1;c<=N;c++){
    const th=document.createElement('th');
    th.className='hdr';th.id=`ch_${c}`;th.textContent=String(c);
    th.style.cssText=`width:${sz}px;height:${sz}px;font-size:${fs}px;`;
    th.addEventListener('click',(col=>()=>{
      navMode='col';navFixed=col;
      updateHeaderSel();
      let startR=1;
      while(startR<=N&&states[`${startR}_${col}`]==='correct') startR++;
      if(startR<=N) focusCell(startR,col);
    })(c));
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody=document.createElement('tbody');
  for(let r=1;r<=N;r++){
    const tr=document.createElement('tr');
    tr.style.height=`${sz}px`;

    const tdh=document.createElement('td');
    tdh.className='hdr-row';tdh.id=`rh_${r}`;tdh.textContent=String(r);
    tdh.style.cssText=`width:${sz}px;height:${sz}px;font-size:${fs}px;`;
    tdh.addEventListener('click',(row=>()=>{
      navMode='row';navFixed=row;
      updateHeaderSel();
      let startC=1;
      while(startC<=N&&states[`${row}_${startC}`]==='correct') startC++;
      if(startC<=N) focusCell(row,startC);
    })(r));
    tr.appendChild(tdh);

    for(let c=1;c<=N;c++){
      const td=document.createElement('td');
      td.className='cell';
      td.style.cssText=`width:${sz}px;height:${sz}px;`;

      const inp=document.createElement('input');
      inp.type='text';inp.inputMode='numeric';inp.autocomplete='off';inp.readOnly=true;
      inp.dataset.r=r;inp.dataset.c=c;
      inp.style.cssText=`font-size:${fs}px;line-height:${sz}px;height:${sz}px;`;

      const k=`${r}_${c}`;
      inputEls[k]=inp;
      states[k]='empty';

      inp.addEventListener('pointerdown',(row=>e=>{
        e.preventDefault();
        const col=parseInt(e.currentTarget.dataset.c,10);
        const rw=parseInt(e.currentTarget.dataset.r,10);
        navMode='col';navFixed=col;
        updateHeaderSel();
        focusCell(rw,col);
      })(r));

      td.appendChild(inp);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  tw.appendChild(table);
  updateHeaderSel();
  updateInfo();
}

rebuildTable();

// ─── Auto-fill da tabela pitagórica (tecla *) ────────────────
function tableAutoFill(){
  if(tableAutoHandle) return; // já rodando
  autoFillMode = true;
  function tick(){
    if(currentMode !== 'table'){ tableAutoHandle=null; return; }
    // acha próxima célula vazia
    let found = false;
    outer: for(let r=1;r<=N;r++) for(let c=1;c<=N;c++){
      if(states[`${r}_${c}`]!=='correct'){
        applyCorrect(r,c);
        if(r!==c) applyCorrect(c,r);
        if(tableComplete()){
          tableAutoHandle=null;
          activeCellKey=null;
          pitStopTimer();
          const pitMs = Date.now() - pitStartMs;
          // autoFillMode=true, saveRecord ignora — mas ainda mostra bloom
          const pitResult = saveRecord('pitagoras', N, pitMs);
          window._lastPitResult = { ms: pitMs, result: pitResult };
          setTimeout(()=>triggerBloom(), 320);
          return;
        }
        found = true;
        break outer;
      }
    }
    if(found){
      tableAutoHandle = setTimeout(tick, 30);
    } else {
      tableAutoHandle = null;
    }
  }
  pitStartTimer();
  tableAutoHandle = setTimeout(tick, 80);
}

let pitTimerRunning = false;
function pitStartTimer(){ if(!pitTimerRunning){ pitStartMs=Date.now(); pitTimerRunning=true; } }

const ROOT_MODES = ['sqrt_exact','sqrt_approx','sqrt_simpl','cbrt_exact','cbrt_approx','cbrt_simpl'];

function setMode(mode){
  currentMode = mode;
  // clear all active states
  ['modeTableBtn','modeQuizBtn','modeSpecBtn','modeFmlBtn','modeSqrtExactBtn','modeSqrtApproxBtn','modeSqrtSimplBtn',

    cbrt_exact:'modeCbrtExactBtn', cbrt_approx:'modeCbrtApproxBtn', cbrt_simpl:'modeCbrtSimplBtn'
  };

  const quizOverlay  = document.getElementById('quizOverlay');
  const rootsOverlay = document.getElementById('rootsOverlay');
  const fmlOverlay   = document.getElementById('fmlOverlay');
  const tableWrap    = document.getElementById('tableWrap');
  const topInfo      = document.getElementById('infoEl');

  rootsOverlay.classList.remove('visible');

  stopQuiz();
  stopRoots();
  stopFml();
  stopDrill();
  document.getElementById('drillOverlay').classList.remove('visible');

  autoFillMode = false;

  document.getElementById('specSection').style.display = (mode==='specific') ? '' : 'none';
  sidebar.classList.remove('open');

    drillShowPicker();
  } else if(ROOT_MODES.includes(mode)){
    rootsOverlay.classList.add('visible');
    startRootsSession(mode);
  }
}

function adjustRange(delta){
  let next = N + delta;
  next = Math.max(10, Math.min(30, next));
  // snap to 10/20/30
  next = Math.round(next/10)*10;
  if(next === N) return;
  setRange(next);
}

const PR_KEY = 'tabuada_records_v1';

function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(PR_KEY)||'{}'); }
  catch(e){ return {}; }
}
function saveRecord(mode, range, ms){
  const records = loadRecords();
  const k = `${mode}_${range}`;
  const prev = records[k];
  if(!autoFillMode){
    records[k] = { best: prev ? Math.min(prev.best, ms) : ms, last: ms, sessions: (prev ? prev.sessions : 0) + 1 };
    localStorage.setItem(PR_KEY, JSON.stringify(records));
  }
  return { prev: prev ? prev.best : null, now: ms, isNew: !autoFillMode && (!prev || ms < prev.best) };
}
function getRecord(mode, range){
  const records = loadRecords();
  return records[`${mode}_${range}`] || null;
}

function fmtMs(ms){
  const totalMs = Math.round(ms);
  const min = Math.floor(totalMs / 60000);
  const sec = Math.floor((totalMs % 60000) / 1000);
  const cs  = Math.floor((totalMs % 1000) / 10);
  return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

const qLog = document.getElementById('quizLog');

}

// Build a shuffled pool — skip a===1 and b===1
let quizPool = [];
let quizPoolIdx = 0;
function buildPool(){
  quizPool = [];
  const shuf = arr => { for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
  if(currentMode==='specific'){
    // fase 1: 1×n até N×n em ordem · fase 2: os mesmos N, embaralhados
    const mk = b => ({q:`${specN} × ${b} =`, a:String(specN*b), b});
    const ordered = []; for(let b=1;b<=N;b++) ordered.push(mk(b));
    const mixed = shuf(ordered.map(x=>({...x})));
    // evita repetir a mesma conta na virada da fase 1 para a 2
    if(mixed.length>1 && mixed[0].b===N){ const k=1+Math.floor(Math.random()*(mixed.length-1)); [mixed[0],mixed[k]]=[mixed[k],mixed[0]]; }
    quizPool = ordered.concat(mixed);
  } else {
    for(let a=2;a<=N;a++) for(let b=2;b<=N;b++) quizPool.push({q:`${a} × ${b} =`, a:String(a*b)});
    shuf(quizPool);
  }
  quizPoolIdx = 0;
}

function tickTimer(){
  if(!quizTimerRunning) return;
  quizElapsedMs = Date.now() - quizStartMs;
  qTimer.textContent = fmtMs(quizElapsedMs);
}
function startTimer(){
  quizStartMs = Date.now();
  quizTimerRunning = true;
  quizElapsedMs = 0;
  if(quizTimerRAF) clearInterval(quizTimerRAF);
  quizTimerRAF = setInterval(tickTimer, 67); // ~15fps, leve
}
function stopTimer(){
  quizTimerRunning = false;
  if(quizTimerRAF){ clearInterval(quizTimerRAF); quizTimerRAF=null; }
}

function updatePRDisplay(){
  const rec = getRecord(quizRecKey(), N);
  if(rec){
    const sessions = rec.sessions || 0;
    qPR.textContent = `recorde ${fmtMs(rec.best)}  ·  ${sessions} sess${sessions===1?'ão':'ões'}`;
  } else {
    qPR.textContent = '';
  }
}

function quizAutoFill(){
  if(quizAutoHandle) return;
  autoFillMode = true;
  function tick(){
    if(!isQuizLike() || quizFinished){ quizAutoHandle=null; return; }
    const answer = quizCurrentAns;
    if(quizTyped.length < answer.length){
      const next = answer[quizTyped.length];
      // simulate digit press via keydown handler
      const ev = new KeyboardEvent('keydown',{key:next,bubbles:true,cancelable:true});
      document.dispatchEvent(ev);
    }
    quizAutoHandle = setTimeout(tick, 160);
  }
  if(!quizTimerRunning) startTimer();
  quizAutoHandle = setTimeout(tick, 80);
}

function startQuizSession(){
  autoFillMode = false;
  document.getElementById('quizOverlay').classList.add('visible');
  if(quizAutoHandle){ clearTimeout(quizAutoHandle); quizAutoHandle=null; }
  quizFinished = false;
  quizAnswered = 0;
  quizLogClear();
  quizTotalQuestions = quizTotalQ();
  buildPool();
  qStr.textContent = `0 / ${quizTotalQuestions}`;
  qTimer.textContent = '00:00.00';
  updatePRDisplay();
  stopTimer();
  quizStartMs = 0; // will start on first input
  const fo = document.getElementById('finishOverlay');
  fo.style.opacity = '0';
  fo.style.pointerEvents = 'none';
  startQuizRound();
}

function startQuizRound(){
  if(quizFinished) return;
  quizLocked = false;
  quizTyped = '';
  if(quizPoolIdx >= quizPool.length){
    finishQuizSession();
    return;
  }
  const item = quizPool[quizPoolIdx++];
  quizCurrentQ = item.q; quizCurrentAns = item.a;
  qEl.textContent  = quizCurrentQ;
  qAns.textContent = '_';
  qAns.className   = '';
  quizAnim();
}

function finishQuizSession(){
  quizFinished = true;
  stopTimer();
  const ms = quizElapsedMs;
  const result = saveRecord(quizRecKey(), N, ms);

  const fo = document.getElementById('finishOverlay');
  const ftEl = document.getElementById('finishTime');
  const flEl = document.getElementById('finishLabel');
  const fdEl = document.getElementById('finishDelta');

  ftEl.textContent = fmtMs(ms);
  flEl.textContent = currentMode==='specific'
    ? `tabuada do ${specN} · até ${N} · ${quizTotalQuestions} questões`
    : `${N}×${N} · aleatório · ${quizTotalQuestions} questões`;

  if(result.isNew){
    if(result.prev === null){
      fdEl.textContent = '◆ primeiro recorde';
      fdEl.style.color = 'var(--ac)';
    } else {
      const delta = result.prev - ms;
      fdEl.textContent = `▲ ${fmtMs(delta)} mais rápido · novo recorde`;
      fdEl.style.color = 'var(--correct)';
    }
  } else {
    const delta = ms - result.prev;
    fdEl.textContent = `▼ ${fmtMs(delta)} mais lento · recorde: ${fmtMs(result.prev)}`;
    fdEl.style.color = 'var(--wrong)';
  }

  document.getElementById('quizOverlay').classList.remove('visible');
  fo.style.opacity = '1';
  fo.style.pointerEvents = 'auto';

  // auto-restart countdown
  let cd = 5;
  const cdEl = document.getElementById('finishCountdown');
  if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
  if(window._quizCdInterval) clearInterval(window._quizCdInterval);
  window._quizCdInterval = setInterval(()=>{
    cd--;
    if(cd <= 0){
      clearInterval(window._quizCdInterval);
      window._quizCdInterval = null;
      if(quizFinished) startQuizSession();
    } else {
      if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
    }
  }, 1000);
}

function stopQuiz(){
  stopTimer();
  if(quizAutoHandle){ clearTimeout(quizAutoHandle); quizAutoHandle=null; }
  if(window._quizCdInterval){ clearInterval(window._quizCdInterval); window._quizCdInterval=null; }
  quizLocked = true;
  quizFinished = false;
  quizStreak = 0;
  quizTyped = '';
  if(qStr) qStr.textContent = '0 / 0';
  const fo = document.getElementById('finishOverlay');
  fo.style.opacity = '0';
  fo.style.pointerEvents = 'none';
}

// Captura de teclas no modo quiz — capture:true garante prioridade
document.addEventListener('keydown', function(e){
  if(!isQuizLike()) return;

  // ← → = trocar o número da tabuada (modo específica)
  if(currentMode === 'specific' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
    e.preventDefault();
    setSpecN(specN + (e.key === 'ArrowRight' ? 1 : -1));
    return;
  }

  // Arrow keys = mudar range (sempre disponível)
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(N < 30) setRange(N === 10 ? 20 : 30);
    return;
  }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(N > 10) setRange(N === 30 ? 20 : 10);
    return;
  }

  // Finish screen: space = restart, esc = exit
  if(quizFinished){
    if(e.key === ' '){ e.preventDefault(); startQuizSession(); return; }
    if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); return; }
    return;
  }

  if(quizLocked) return;

  if(e.key === 'Backspace'){
    e.preventDefault();
    quizTyped = quizTyped.slice(0, -1);
    qAns.textContent = quizTyped || '_';
    if(!quizTyped) qAns.classList.remove('wrong', 'shaking', 'correct');
    return;
  }

  if(!/^\d$/.test(e.key)) return;
  e.preventDefault();

  // start timer on very first input
  if(!quizTimerRunning) startTimer();

  const answer = quizCurrentAns;
  const next   = quizTyped + e.key;

  qAns.textContent = next;
  qAns.classList.remove('wrong', 'shaking', 'correct');

  if(!answer.startsWith(next)){
    // ERROU — fica vermelho, limpa, espera digitar certo
    quizTyped = '';
    qAns.classList.add('wrong');
    void qAns.offsetWidth;
    qAns.classList.add('shaking');
    setTimeout(()=>{
      qAns.classList.remove('shaking');
      qAns.textContent = '_';
      // mantém classe 'wrong' como lembrete até digitar
    }, 350);
    return;
  }

  quizTyped = next;
  qAns.classList.remove('wrong'); // estava certo até aqui

  if(quizTyped === answer){
    // ACERTOU
    quizLocked = true;
    quizAnswered++;
    quizLogAdd(quizCurrentQ, quizCurrentAns);
    qStr.textContent = `${quizAnswered} / ${quizTotalQuestions}`;
    qAns.classList.remove('wrong');
    qAns.classList.add('correct');
    setTimeout(()=>{ startQuizRound(); }, 320);
  }
}, true);

// ── Datasets ─────────────────────────────────────────────────
const SQRT_EXACT = [
  [1,1],[4,2],[9,3],[16,4],[25,5],[36,6],[49,7],[64,8],[81,9],[100,10],[121,11],[144,12],[169,13],[196,14],[225,15],[256,16],[289,17],[324,18],[361,19],[400,20],[441,21],[484,22],[529,23],[576,24],[625,25],[676,26],[729,27],[784,28],[841,29],[900,30],[961,31],[1024,32],[1089,33],[1156,34],[1225,35],[1296,36],[1369,37],[1444,38],[1521,39],[1600,40]
];
const SQRT_APPROX = [
  // [radicand, display_answer_x100]  → user types digits of a,bb  e.g. 141 for 1.41
  [2,'141'],[3,'173'],[5,'223'],[6,'245'],[7,'264'],[8,'283'],[10,'316'],
  [11,'331'],[12,'346'],[13,'360'],[15,'387']
];
const SQRT_SIMPL = [
  // [radicand, coef, inner]  √radicand = coef√inner
  [8,2,2],[12,2,3],[18,3,2],[20,2,5],[24,2,6],[27,3,3],[32,4,2],
  [45,3,5],[48,4,3],[50,5,2],[72,6,2],[75,5,3],[98,7,2],[108,6,3]
];
const CBRT_EXACT = [
  [1,1],[8,2],[27,3],[64,4],[125,5],[216,6],[343,7],[512,8],[729,9],[1000,10]
];
const CBRT_APPROX = [
  [2,'126'],[3,'144'],[5,'171'],[10,'215']
];
const CBRT_SIMPL = [
  // [radicand, coef, inner]  ∛radicand = coef∛inner
  [16,2,2],[54,3,2],[81,3,3],[128,4,2],[250,5,2],
  [24,2,3],[375,5,3],[48,2,6],[192,4,3],[500,5,4]
];

// ── State ─────────────────────────────────────────────────────
let rootsMode = '';          // current sub-mode
let rootsPool = [];          // [{q, ansA, ansB, symLabel}]
let rootsIdx = 0;
let rootsCurrent = null;
let rootsPhase = 'A';        // 'A' | 'B' | 'C'
let rootsTypedA = '';
let rootsTypedB = '';
let rootsTypedC = '';
let rootsLocked = false;
let rootsFinished = false;
let rootsAnswered = 0;
let rootsStartMs = 0;
let rootsTimerRunning = false;
let rootsTimerHandle = null;
let rootsAutoHandle = null;

const rTimer = document.getElementById('rootsTimer');
const rProgress = document.getElementById('rootsProgress');
const rPR = document.getElementById('rootsPR');
const rLine = document.getElementById('rootsLine');
const rQuestion = document.getElementById('rootsQuestion');
const rAnsWrapA = document.getElementById('rootsAnsWrapA');
const rAnsA = document.getElementById('rootsAnsA');
const rPhBLabel = document.getElementById('rootsPhBLabel');
const rAnsWrapB = document.getElementById('rootsAnsWrapB');
const rAnsB = document.getElementById('rootsAnsB');
// phase C removed — simpl now uses only A (coef) + B (inner)

function rootsStartTimer(){
  if(rootsTimerRunning) return;
  rootsStartMs = Date.now();
  rootsTimerRunning = true;
  rootsTimerHandle = setInterval(()=>{
    rTimer.textContent = fmtMs(Date.now() - rootsStartMs);
  }, 67);
}
function rootsStopTimer(){
  rootsTimerRunning = false;
  if(rootsTimerHandle){ clearInterval(rootsTimerHandle); rootsTimerHandle=null; }
}

function rootsModeLabel(m){
  return {sqrt_exact:'√ exatas',sqrt_approx:'√ aprox',sqrt_simpl:'√ simplif',
          cbrt_exact:'∛ exatas',cbrt_approx:'∛ aprox',cbrt_simpl:'∛ simplif'}[m]||m;
}

function rootsUpdatePR(){
  const rec = getRecord(rootsMode, 0);
  if(rec){
    rPR.textContent = `recorde ${fmtMs(rec.best)}  ·  ${rec.sessions} sess${rec.sessions===1?'ão':'ões'}`;
  } else {
    rPR.textContent = '';
  }
}

function buildRootsPool(mode){
  let src;
  if(mode==='sqrt_exact') src = SQRT_EXACT.map(([rad,ans])=>({
    q:`√ ${rad} =`, parts:['A'], ansA:String(ans), sym:null
  }));
  else if(mode==='sqrt_approx') src = SQRT_APPROX.map(([rad,ans])=>({
    q:`√ ${rad} ≈`, parts:['A'], ansA:ans, sym:null
  }));
  else if(mode==='sqrt_simpl') src = SQRT_SIMPL.map(([rad,c,i])=>{
    // Phase A: coeficiente (c), Phase B: radicando (i)
    return { q:`√ ${rad} =`, parts:['A','B'], ansA:String(c), ansB:String(i), sym:'√' };
  });
  else if(mode==='cbrt_exact') src = CBRT_EXACT.map(([rad,ans])=>({
    q:`∛ ${rad} =`, parts:['A'], ansA:String(ans), sym:null
  }));
  else if(mode==='cbrt_approx') src = CBRT_APPROX.map(([rad,ans])=>({
    q:`∛ ${rad} ≈`, parts:['A'], ansA:ans, sym:null
  }));
  else if(mode==='cbrt_simpl') src = CBRT_SIMPL.map(([rad,c,i])=>{
    return { q:`∛ ${rad} =`, parts:['A','B'], ansA:String(c), ansB:String(i), sym:'∛' };
  });
  // shuffle
  for(let i=src.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [src[i],src[j]]=[src[j],src[i]]; }
  return src;
}

function startRootsSession(mode){
  autoFillMode = false;
  rootsMode = mode;
  rootsPool = buildRootsPool(mode);
  rootsIdx = 0;
  rootsAnswered = 0;
  rootsFinished = false;
  rootsLocked = false;
  rootsStopTimer();
  rTimer.textContent = '00:00.00';
  rProgress.textContent = `0 / ${rootsPool.length}`;
  rootsUpdatePR();
  document.getElementById('rootsFinishOverlay').style.opacity='0';
  document.getElementById('rootsFinishOverlay').style.pointerEvents='none';
  rootsNextQuestion();
}

function rootsNextQuestion(){
  if(rootsIdx >= rootsPool.length){ rootsFinishSession(); return; }
  rootsCurrent = rootsPool[rootsIdx++];
  rootsPhase = 'A';
  rootsTypedA = '';
  rootsTypedB = '';
  rootsTypedC = '';
  rootsLocked = false;

  const cur = rootsCurrent;
  const isSimpl = cur.parts && cur.parts.length === 2 && cur.sym;
  const phBSym = document.getElementById('rootsPhBSym');

  rQuestion.textContent = cur.q + ' ';

  // Phase A always visible
  rAnsWrapA.className = 'roots-ans-wrap';
  rAnsA.textContent = '_';

  // Phase B: show immediately in simpl with ·√_ visible
  if(isSimpl){
    rPhBLabel.style.display = '';
    if(phBSym){ phBSym.textContent = cur.sym; phBSym.style.display = ''; }
    rAnsWrapB.style.display = '';
    rAnsWrapB.className = 'roots-ans-wrap';
    rAnsB.textContent = '_';
  } else {
    rPhBLabel.style.display = 'none';
    if(phBSym) phBSym.style.display = 'none';
    rAnsWrapB.style.display = 'none';
  }

  rLine.classList.remove('anim');
  void rLine.offsetWidth;
  rLine.classList.add('anim');
}

function rootsShake(wrap){
  wrap.classList.remove('shaking');
  wrap.classList.add('wrong');
  void wrap.offsetWidth;
  wrap.classList.add('shaking');
  setTimeout(()=>{ wrap.classList.remove('shaking'); }, 380);
}

// Formata string de dígitos de aproximação com vírgula: '141' → '1,41'
function rootsFmtApprox(digits){
  if(!digits) return '_';
  if(digits.length === 0) return '_';
  if(digits.length === 1) return digits;
  return digits[0] + ',' + digits.slice(1);
}

// Retorna true se o modo atual é de aproximação (exibe com vírgula)
function rootsIsApproxMode(){
  return rootsMode === 'sqrt_approx' || rootsMode === 'cbrt_approx';
}

function rootsHandleDigit(key){
  if(rootsLocked || rootsFinished) return;
  rootsStartTimer();
  const cur = rootsCurrent;
  const isSimpl = cur.parts && cur.parts.length === 2 && cur.sym;

  if(rootsPhase === 'A'){
    const next = rootsTypedA + key;
    const target = cur.ansA;
    if(!target.startsWith(next)){
      rootsTypedA = '';
      rAnsA.textContent = '_';
      rootsShake(rAnsWrapA);
      return;
    }
    rootsTypedA = next;
    rAnsA.textContent = rootsIsApproxMode() ? rootsFmtApprox(next) : next;
    rAnsWrapA.classList.remove('wrong');
    if(rootsTypedA === target){
      rAnsWrapA.classList.add('correct');
      if(isSimpl){
        rootsPhase = 'B';
      } else {
        rootsCorrect();
      }
    }
  } else if(rootsPhase === 'B'){
    const next = rootsTypedB + key;
    const target = cur.ansB;
    if(!target.startsWith(next)){
      rootsTypedB = '';
      rAnsB.textContent = '_';
      rootsShake(rAnsWrapB);
      return;
    }
    rootsTypedB = next;
    rAnsB.textContent = next;
    rAnsWrapB.classList.remove('wrong');
    if(rootsTypedB === target){
      rAnsWrapB.classList.add('correct');
      rootsCorrect();
    }
  }
}

function rootsHandleBackspace(){
  if(rootsLocked || rootsFinished) return;
  if(rootsPhase === 'B' && rootsTypedB.length > 0){
    rootsTypedB = rootsTypedB.slice(0,-1);
    rAnsB.textContent = rootsTypedB || '_';
    if(!rootsTypedB) rAnsWrapB.classList.remove('wrong');
  } else if(rootsPhase === 'A' && rootsTypedA.length > 0){
    rootsTypedA = rootsTypedA.slice(0,-1);
    rAnsA.textContent = rootsTypedA ? (rootsIsApproxMode() ? rootsFmtApprox(rootsTypedA) : rootsTypedA) : '_';
    if(!rootsTypedA) rAnsWrapA.classList.remove('wrong');
  }
}

function rootsCorrect(){
  rootsLocked = true;
  rootsAnswered++;
  rProgress.textContent = `${rootsAnswered} / ${rootsPool.length}`;
  rAnsWrapA.classList.remove('wrong');
  rAnsWrapA.classList.add('correct');
  rAnsWrapB.classList.remove('wrong');
  rAnsWrapB.classList.add('correct');
  setTimeout(()=>{ rootsNextQuestion(); }, 320);
}

function rootsFinishSession(){
  rootsFinished = true;
  const elapsed = Date.now() - rootsStartMs;
  rootsStopTimer();
  const result = saveRecord(rootsMode, 0, elapsed);

  const fo = document.getElementById('rootsFinishOverlay');
  document.getElementById('rootsFinishTime').textContent = fmtMs(elapsed);
  document.getElementById('rootsFinishLabel').textContent =
    `${rootsModeLabel(rootsMode)} · ${rootsPool.length} questões`;
  const fd = document.getElementById('rootsFinishDelta');
  if(autoFillMode){
    fd.textContent = '∗ modo automático · não salvo';
    fd.style.color = 'var(--txt-dim)';
  } else if(result.isNew){
    if(result.prev===null){
      fd.textContent = '◆ primeiro recorde';
      fd.style.color = 'var(--ac)';
    } else {
      fd.textContent = `▲ ${fmtMs(result.prev - elapsed)} mais rápido · novo recorde`;
      fd.style.color = 'var(--correct)';
    }
  } else {
    fd.textContent = `▼ ${fmtMs(elapsed - result.prev)} mais lento · recorde: ${fmtMs(result.prev)}`;
    fd.style.color = 'var(--wrong)';
  }
  document.getElementById('rootsOverlay').classList.remove('visible');
  fo.style.opacity = '1';
  fo.style.pointerEvents = 'auto';

  // auto-restart countdown
  let cd = 5;
  const cdEl = document.getElementById('rootsFinishCountdown');
  if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
  if(window._rootsCdInterval) clearInterval(window._rootsCdInterval);
  window._rootsCdInterval = setInterval(()=>{
    cd--;
    if(cd <= 0){
      clearInterval(window._rootsCdInterval);
      window._rootsCdInterval = null;
      if(rootsFinished) startRootsSession(rootsMode);
    } else {
      if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
    }
  }, 1000);
}

function stopRoots(){
  rootsStopTimer();
  rootsFinished = false;
  rootsLocked = true;
  if(rootsAutoHandle){ clearTimeout(rootsAutoHandle); rootsAutoHandle=null; }
  if(window._rootsCdInterval){ clearInterval(window._rootsCdInterval); window._rootsCdInterval=null; }
  document.getElementById('rootsFinishOverlay').style.opacity='0';
  document.getElementById('rootsFinishOverlay').style.pointerEvents='none';
}

// ── Auto-complete on * ────────────────────────────────────────
function rootsAutoFill(){
  if(rootsAutoHandle) return;
  autoFillMode = true;
  function tick(){
    if(!rootsCurrent || rootsFinished){ rootsAutoHandle=null; return; }
    const cur = rootsCurrent;
    let next;
    if(rootsPhase==='A') next = cur.ansA[rootsTypedA.length];
    else if(rootsPhase==='B') next = cur.ansB[rootsTypedB.length];
    if(next) rootsHandleDigit(next);
    rootsAutoHandle = setTimeout(tick, 180);
  }
  rootsAutoHandle = setTimeout(tick, 80);
}

// ── Keyboard handler ──────────────────────────────────────────
document.addEventListener('keydown', function(e){
  if(!ROOT_MODES.includes(currentMode)) return;

  // finish screen
  if(rootsFinished){
    if(e.key===' '){ e.preventDefault(); startRootsSession(rootsMode); }
    if(e.key==='Escape'){ e.preventDefault(); setMode('table'); }
    return;
  }

  if(e.key==='Backspace'){ e.preventDefault(); rootsHandleBackspace(); return; }
  if(/^\d$/.test(e.key)){ e.preventDefault(); rootsHandleDigit(e.key); return; }
}, true);
