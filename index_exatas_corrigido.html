// ROOTS MODE
// ═══════════════════════════════════════════════════════════════

// ── Datasets ─────────────────────────────────────────────────
const SQRT_EXACT = [
  [1,1],[4,2],[9,3],[16,4],[25,5],[36,6],[49,7],[64,8],[81,9],[100,10],
  [121,11],[144,12],[169,13],[196,14],[225,15],[256,16],[289,17],[324,18],[361,19],[400,20]
];
const SQRT_APPROX = [
  // [radicand, display_answer_x100]  → user types digits of a,bb  e.g. 141 for 1.41
  [2,'141'],[3,'173'],[5,'223'],[6,'245'],[7,'264'],[8,'283'],[10,'316'],
  [11,'331'],[12,'346'],[13,'360'],[15,'387']
];
const SQRT_SIMPL = [
  // [radicand, coef, inner]  √radicand = coef√inner
  [8,2,2],[12,2,3],[18,3,2],[20,2,5],[24,2,6],[27,3,3],[32,4,2],
  [45,3,5],[48,4,3],[50,5,2],[72,6,2],[75,5,3],[98,7,2],[108,6,3]
];
const CBRT_EXACT = [
  [1,1],[8,2],[27,3],[64,4],[125,5],[216,6],[343,7],[512,8],[729,9],[1000,10]
];
const CBRT_APPROX = [
  [2,'126'],[3,'144'],[5,'171'],[10,'215']
];
const CBRT_SIMPL = [
  // [radicand, coef, inner]  ∛radicand = coef∛inner
  [16,2,2],[54,3,2],[81,3,3],[128,4,2],[250,5,2],
  [24,2,3],[375,5,3],[48,2,6],[192,4,3],[500,5,4]
];

// ── State ─────────────────────────────────────────────────────
let rootsMode = '';          // current sub-mode
let rootsPool = [];          // [{q, ansA, ansB, symLabel}]
let rootsIdx = 0;
let rootsCurrent = null;
let rootsPhase = 'A';        // 'A' | 'B' | 'C'
let rootsTypedA = '';
let rootsTypedB = '';
let rootsTypedC = '';
let rootsLocked = false;
let rootsFinished = false;
let rootsAnswered = 0;
let rootsStartMs = 0;
let rootsTimerRunning = false;
let rootsTimerHandle = null;
let rootsAutoHandle = null;

const rTimer = document.getElementById('rootsTimer');
const rProgress = document.getElementById('rootsProgress');
const rPR = document.getElementById('rootsPR');
const rLine = document.getElementById('rootsLine');
const rQuestion = document.getElementById('rootsQuestion');
const rAnsWrapA = document.getElementById('rootsAnsWrapA');
const rAnsA = document.getElementById('rootsAnsA');
const rPhBLabel = document.getElementById('rootsPhBLabel');
const rAnsWrapB = document.getElementById('rootsAnsWrapB');
const rAnsB = document.getElementById('rootsAnsB');
// phase C removed — simpl now uses only A (coef) + B (inner)

function rootsStartTimer(){
  if(rootsTimerRunning) return;
  rootsStartMs = Date.now();
  rootsTimerRunning = true;
  rootsTimerHandle = setInterval(()=>{
    rTimer.textContent = fmtMs(Date.now() - rootsStartMs);
  }, 67);
}
function rootsStopTimer(){
  rootsTimerRunning = false;
  if(rootsTimerHandle){ clearInterval(rootsTimerHandle); rootsTimerHandle=null; }
}

function rootsModeLabel(m){
  return {sqrt_exact:'√ exatas',sqrt_approx:'√ aprox',sqrt_simpl:'√ simplif',
          cbrt_exact:'∛ exatas',cbrt_approx:'∛ aprox',cbrt_simpl:'∛ simplif'}[m]||m;
}

function rootsUpdatePR(){
  const rec = getRecord(rootsMode, 0);
  if(rec){
    rPR.textContent = `recorde ${fmtMs(rec.best)}  ·  ${rec.sessions} sess${rec.sessions===1?'ão':'ões'}`;
  } else {
    rPR.textContent = '';
  }
}

function buildRootsPool(mode){
  let src;
  if(mode==='sqrt_exact'){
    const base = SQRT_EXACT.filter(([rad,ans])=>ans<=N).map(([rad,ans])=>({
      q:`√ ${rad} =`, parts:['A'], ansA:String(ans), sym:null
    }));
    const shuffled = [...base];
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    src = [...base,...shuffled];
  }
  else if(mode==='sqrt_approx') src = SQRT_APPROX.map(([rad,ans])=>({
    q:`√ ${rad} ≈`, parts:['A'], ansA:ans, sym:null
  }));
  else if(mode==='sqrt_simpl') src = SQRT_SIMPL.map(([rad,c,i])=>{
    // Phase A: coeficiente (c), Phase B: radicando (i)
    return { q:`√ ${rad} =`, parts:['A','B'], ansA:String(c), ansB:String(i), sym:'√' };
  });
  else if(mode==='cbrt_exact'){
    const base = CBRT_EXACT.filter(([rad,ans])=>ans<=N).map(([rad,ans])=>({
      q:`∛ ${rad} =`, parts:['A'], ansA:String(ans), sym:null
    }));
    const shuffled = [...base];
    for(let i=shuffled.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    src = [...base,...shuffled];
  }
  else if(mode==='cbrt_approx') src = CBRT_APPROX.map(([rad,ans])=>({
    q:`∛ ${rad} ≈`, parts:['A'], ansA:ans, sym:null
  }));
  else if(mode==='cbrt_simpl') src = CBRT_SIMPL.map(([rad,c,i])=>{
    return { q:`∛ ${rad} =`, parts:['A','B'], ansA:String(c), ansB:String(i), sym:'∛' };
  });
  // shuffle
  for(let i=src.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [src[i],src[j]]=[src[j],src[i]]; }
  return src;
}

function startRootsSession(mode){
  autoFillMode = false;
  rootsMode = mode;
  rootsPool = buildRootsPool(mode);
  rootsIdx = 0;
  rootsAnswered = 0;
  rootsFinished = false;
  rootsLocked = false;
  rootsStopTimer();
  rTimer.textContent = '00:00.00';
  rProgress.textContent = `0 / ${rootsPool.length}`;
  rootsUpdatePR();
  document.getElementById('rootsFinishOverlay').style.opacity='0';
  document.getElementById('rootsFinishOverlay').style.pointerEvents='none';
  rootsNextQuestion();
}

function rootsNextQuestion(){
  if(rootsIdx >= rootsPool.length){ rootsFinishSession(); return; }
  rootsCurrent = rootsPool[rootsIdx++];
  rootsPhase = 'A';
  rootsTypedA = '';
  rootsTypedB = '';
  rootsTypedC = '';
  rootsLocked = false;

  const cur = rootsCurrent;
  const isSimpl = cur.parts && cur.parts.length === 2 && cur.sym;
  const phBSym = document.getElementById('rootsPhBSym');

  rQuestion.textContent = cur.q + ' ';

  // Phase A always visible
  rAnsWrapA.className = 'roots-ans-wrap';
  rAnsA.textContent = '_';

  // Phase B: show immediately in simpl with ·√_ visible
  if(isSimpl){
    rPhBLabel.style.display = '';
    if(phBSym){ phBSym.textContent = cur.sym; phBSym.style.display = ''; }
    rAnsWrapB.style.display = '';
    rAnsWrapB.className = 'roots-ans-wrap';
    rAnsB.textContent = '_';
  } else {
    rPhBLabel.style.display = 'none';
    if(phBSym) phBSym.style.display = 'none';
    rAnsWrapB.style.display = 'none';
  }

  rLine.classList.remove('anim');
  void rLine.offsetWidth;
  rLine.classList.add('anim');
}

function rootsShake(wrap){
  wrap.classList.remove('shaking');
  wrap.classList.add('wrong');
  void wrap.offsetWidth;
  wrap.classList.add('shaking');
  setTimeout(()=>{ wrap.classList.remove('shaking'); }, 380);
}

// Formata string de dígitos de aproximação com vírgula: '141' → '1,41'
function rootsFmtApprox(digits){
  if(!digits) return '_';
  if(digits.length === 0) return '_';
  if(digits.length === 1) return digits;
  return digits[0] + ',' + digits.slice(1);
}

// Retorna true se o modo atual é de aproximação (exibe com vírgula)
function rootsIsApproxMode(){
  return rootsMode === 'sqrt_approx' || rootsMode === 'cbrt_approx';
}

function rootsHandleDigit(key){
  if(rootsLocked || rootsFinished) return;
  rootsStartTimer();
  const cur = rootsCurrent;
  const isSimpl = cur.parts && cur.parts.length === 2 && cur.sym;

  if(rootsPhase === 'A'){
    const next = rootsTypedA + key;
    const target = cur.ansA;
    if(!target.startsWith(next)){
      rootsTypedA = '';
      rAnsA.textContent = '_';
      rootsShake(rAnsWrapA);
      return;
    }
    rootsTypedA = next;
    rAnsA.textContent = rootsIsApproxMode() ? rootsFmtApprox(next) : next;
    rAnsWrapA.classList.remove('wrong');
    if(rootsTypedA === target){
      rAnsWrapA.classList.add('correct');
      if(isSimpl){
        rootsPhase = 'B';
      } else {
        rootsCorrect();
      }
    }
  } else if(rootsPhase === 'B'){
    const next = rootsTypedB + key;
    const target = cur.ansB;
    if(!target.startsWith(next)){
      rootsTypedB = '';
      rAnsB.textContent = '_';
      rootsShake(rAnsWrapB);
      return;
    }
    rootsTypedB = next;
    rAnsB.textContent = next;
    rAnsWrapB.classList.remove('wrong');
    if(rootsTypedB === target){
      rAnsWrapB.classList.add('correct');
      rootsCorrect();
    }
  }
}

function rootsHandleBackspace(){
  if(rootsLocked || rootsFinished) return;
  if(rootsPhase === 'B' && rootsTypedB.length > 0){
    rootsTypedB = rootsTypedB.slice(0,-1);
    rAnsB.textContent = rootsTypedB || '_';
    if(!rootsTypedB) rAnsWrapB.classList.remove('wrong');
  } else if(rootsPhase === 'A' && rootsTypedA.length > 0){
    rootsTypedA = rootsTypedA.slice(0,-1);
    rAnsA.textContent = rootsTypedA ? (rootsIsApproxMode() ? rootsFmtApprox(rootsTypedA) : rootsTypedA) : '_';
    if(!rootsTypedA) rAnsWrapA.classList.remove('wrong');
  }
}

function rootsCorrect(){
  rootsLocked = true;
  rootsAnswered++;
  rProgress.textContent = `${rootsAnswered} / ${rootsPool.length}`;
  rAnsWrapA.classList.remove('wrong');
  rAnsWrapA.classList.add('correct');
  rAnsWrapB.classList.remove('wrong');
  rAnsWrapB.classList.add('correct');
  setTimeout(()=>{ rootsNextQuestion(); }, 320);
}

function rootsFinishSession(){
  rootsFinished = true;
  const elapsed = Date.now() - rootsStartMs;
  rootsStopTimer();
  const result = saveRecord(rootsMode, 0, elapsed);

  const fo = document.getElementById('rootsFinishOverlay');
  document.getElementById('rootsFinishTime').textContent = fmtMs(elapsed);
  document.getElementById('rootsFinishLabel').textContent =
    `${rootsModeLabel(rootsMode)} · ${rootsPool.length} questões`;
  const fd = document.getElementById('rootsFinishDelta');
  if(autoFillMode){
    fd.textContent = '∗ modo automático · não salvo';
    fd.style.color = 'var(--txt-dim)';
  } else if(result.isNew){
    if(result.prev===null){
      fd.textContent = '✿ primeiro recorde';
      fd.style.color = 'var(--ac)';
    } else {
      fd.textContent = `▲ ${fmtMs(result.prev - elapsed)} mais rápido · novo recorde`;
      fd.style.color = 'var(--correct)';
    }
  } else {
    fd.textContent = `▼ ${fmtMs(elapsed - result.prev)} mais lento · recorde: ${fmtMs(result.prev)}`;
    fd.style.color = 'var(--wrong)';
  }
  document.getElementById('rootsOverlay').classList.remove('visible');
  fo.style.opacity = '1';
  fo.style.pointerEvents = 'auto';

  // auto-restart countdown
  let cd = 5;
  const cdEl = document.getElementById('rootsFinishCountdown');
  if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
  if(window._rootsCdInterval) clearInterval(window._rootsCdInterval);
  window._rootsCdInterval = setInterval(()=>{
    cd--;
    if(cd <= 0){
      clearInterval(window._rootsCdInterval);
      window._rootsCdInterval = null;
      if(rootsFinished) startRootsSession(rootsMode);
    } else {
      if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
    }
  }, 1000);
}

function stopRoots(){
  rootsStopTimer();
  rootsFinished = false;
  rootsLocked = true;
  if(rootsAutoHandle){ clearTimeout(rootsAutoHandle); rootsAutoHandle=null; }
  if(window._rootsCdInterval){ clearInterval(window._rootsCdInterval); window._rootsCdInterval=null; }
  document.getElementById('rootsFinishOverlay').style.opacity='0';
  document.getElementById('rootsFinishOverlay').style.pointerEvents='none';
}

// ── Auto-complete on * ────────────────────────────────────────
function rootsAutoFill(){
  if(rootsAutoHandle) return;
  autoFillMode = true;
  function tick(){
    if(!rootsCurrent || rootsFinished){ rootsAutoHandle=null; return; }
    const cur = rootsCurrent;
    let next;
    if(rootsPhase==='A') next = cur.ansA[rootsTypedA.length];
    else if(rootsPhase==='B') next = cur.ansB[rootsTypedB.length];
    if(next) rootsHandleDigit(next);
    rootsAutoHandle = setTimeout(tick, 180);
  }
  rootsAutoHandle = setTimeout(tick, 80);
}

// ── Keyboard handler ──────────────────────────────────────────
document.addEventListener('keydown', function(e){
  if(!ROOT_MODES.includes(currentMode)) return;

  // finish screen
  if(rootsFinished){
    if(e.key===' '){ e.preventDefault(); startRootsSession(rootsMode); }
    if(e.key==='Escape'){ e.preventDefault(); setMode('table'); }
    return;
  }

  if(e.key==='Backspace'){ e.preventDefault(); rootsHandleBackspace(); return; }
  if(/^\d$/.test(e.key)){ e.preventDefault(); rootsHandleDigit(e.key); return; }
}, true);

// ═══════════════════════════════════════════════════════════════
// FORMULAS MODE — visual token system
// ═══════════════════════════════════════════════════════════════

// ── HTML builders ────────────────────────────────────────────
function sup(...c){ return `<span class="fml-sup">${c.join('')}</span>`; }
function sub(...c){ return `<span class="fml-sub">${c.join('')}</span>`; }
function frac(num, den){ return `<span class="fml-frac"><span class="fml-num">${num}</span><span class="fml-den">${den}</span></span>`; }
function sqrt(body){ return `<span class="fml-sqrt"><span class="fml-sqrt-sign">√</span><span class="fml-sqrt-body">${body}</span></span>`; }
function cbrt(body){ return `<span class="fml-sqrt"><span class="fml-cbrt-idx">3</span><span class="fml-sqrt-sign">√</span><span class="fml-sqrt-body">${body}</span></span>`; }

// tok(key, html) — key is what user types, html is visual
// key chars must match exactly what gets validated char by char
function t(k, h){ return {k, h: h||k}; }

// ── Dataset ──────────────────────────────────────────────────
// Each item: { section, prompt, phases: [{key, tokens}] }
// key = full string to type; tokens = [{k,h}] where k slices add up to key
const FML_DATA = [
  // 01 · Álgebra
  { section:'01 · Álgebra', prompt:'quadrado da soma',
    phases:[{ key:'(a+b)²=a²+2ab+b²',
      tokens:[t('(a+b)'),t('²','<span class="fml-sup">2</span>'),t('='),t('a'),t('²','<span class="fml-sup">2</span>'),t('+2ab+'),t('b'),t('²','<span class="fml-sup">2</span>')] }] },

  { section:'01 · Álgebra', prompt:'quadrado da diferença',
    phases:[{ key:'(a-b)²=a²-2ab+b²',
      tokens:[t('(a-b)'),t('²','<span class="fml-sup">2</span>'),t('='),t('a'),t('²','<span class="fml-sup">2</span>'),t('-2ab+'),t('b'),t('²','<span class="fml-sup">2</span>')] }] },

  { section:'01 · Álgebra', prompt:'produto da soma pela diferença',
    phases:[{ key:'(a+b)(a-b)=a²-b²',
      tokens:[t('(a+b)(a-b)='),t('a'),t('²','<span class="fml-sup">2</span>'),t('-'),t('b'),t('²','<span class="fml-sup">2</span>')] }] },

  { section:'01 · Álgebra', prompt:'cubo da soma',
    phases:[{ key:'(a+b)³=a³+3a²b+3ab²+b³',
      tokens:[t('(a+b)'),t('³','<span class="fml-sup">3</span>'),t('='),t('a'),t('³','<span class="fml-sup">3</span>'),t('+3'),t('a'),t('²','<span class="fml-sup">2</span>'),t('b+3a'),t('b'),t('²','<span class="fml-sup">2</span>'),t('+'),t('b'),t('³','<span class="fml-sup">3</span>')] }] },

// ── State ────────────────────────────────────────────────────

let fmlStartMs     = 0;
let fmlTimerRunning= false;

// ── DOM refs ─────────────────────────────────────────────────
const fmlTimerEl    = document.getElementById('fmlTimer');
const fmlProgressEl = document.getElementById('fmlProgress');
const fmlPREl       = document.getElementById('fmlPR');
const fmlLineEl     = document.getElementById('fmlLine');
const fmlPromptEl   = document.getElementById('fmlPrompt');
const fmlSectionEl  = document.getElementById('fmlSection');
const fmlHintEl     = document.getElementById('fmlHint');

// ── Timer ────────────────────────────────────────────────────
function fmlStartTimer(){
  if(fmlTimerRunning) return;
  fmlStartMs = Date.now();
  fmlTimerRunning = true;
  fmlTimerHandle = setInterval(()=>{
    fmlTimerEl.textContent = fmtMs(Date.now() - fmlStartMs);
  }, 67);
}
function fmlStopTimer(){
  fmlTimerRunning = false;
  if(fmlTimerHandle){ clearInterval(fmlTimerHandle); fmlTimerHandle=null; }
}

// ── PR display ───────────────────────────────────────────────
function fmlUpdatePR(){
  const rec = getRecord('formulas', 0);
  if(rec){
    fmlPREl.textContent = `recorde ${fmtMs(rec.best)}  ·  ${rec.sessions} sess${rec.sessions===1?'ão':'ões'}`;
  } else {
    fmlPREl.textContent = '';
  }
}

// ── Pool ─────────────────────────────────────────────────────
function buildFmlPool(){
  const pool = FML_DATA.map(item => ({...item}));
  for(let i = pool.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool;
}

// ── Token helpers ────────────────────────────────────────────
// For a phase, flatten all token keys into one string = the full key
function phaseKey(phase){ return phase.tokens.map(tk=>tk.k).join(''); }

// Build visual HTML for a phase, colouring tokens by how much has been typed
// typed = string typed so far; state = 'active'|'done'|'future'|'wrong'
function buildPhaseHTML(phase, typedSoFar, rowState){
  let html = '';
  let consumed = 0; // chars consumed from typedSoFar
  const total = typedSoFar.length;

  for(const tk of phase.tokens){
    const klen = tk.k.length;
    const start = consumed;
    const end   = consumed + klen;

    let cls;
    if(rowState === 'done'){
      cls = 'done';
    } else if(rowState === 'future'){
      cls = ''; // dim (default)
    } else if(rowState === 'wrong'){
      // active row, wrong state — all pending become wrong-ish but show dim
      if(start < total) cls = 'done'; // already typed bits stay done
      else cls = ''; // rest dim
    } else {
      // active row
      if(end <= total){
        cls = 'done';
      } else if(start < total){
        cls = 'active'; // partially typed token
      } else {
        cls = 'active'; // next token to type
        // only the very first untyped token gets the active class; rest stay dim
        // Fix: only the immediately-next token is active, rest are ''
      }
    }

    // Refine: only the current token (first not fully typed) is 'active'; subsequent ones are ''
    if(rowState === 'active'){
      if(end <= total){
        cls = 'done';
      } else if(start <= total && total < end){
        cls = 'active';
      } else {
        cls = ''; // future token within this row
      }
    }

    html += `<span class="fml-tok ${cls}">${tk.h}</span>`;
    consumed = end;
  }
  return html;
}

// ── Build cursor element ──────────────────────────────────────
function insertCursor(rowEl){
  const cur = document.createElement('span');
  cur.className = 'fml-cursor';
  rowEl.appendChild(cur);
}

// ── Start/stop ───────────────────────────────────────────────
function startFmlSession(){
  autoFillMode = false;
  if(fmlAutoHandle){ clearTimeout(fmlAutoHandle); fmlAutoHandle=null; }
  fmlPool     = buildFmlPool();
  fmlIdx      = 0;
  fmlAnswered = 0;
  fmlFinished = false;
  fmlLocked   = false;
  fmlStopTimer();
  fmlTimerEl.textContent = '00:00.00';
  fmlProgressEl.textContent = `0 / ${fmlPool.length}`;
  fmlUpdatePR();
  document.getElementById('fmlFinishOverlay').style.opacity = '0';
  document.getElementById('fmlFinishOverlay').style.pointerEvents = 'none';
  fmlNextQuestion();
}

function stopFml(){
  fmlStopTimer();
  if(fmlAutoHandle){ clearTimeout(fmlAutoHandle); fmlAutoHandle=null; }
  if(window._fmlCdInterval){ clearInterval(window._fmlCdInterval); window._fmlCdInterval=null; }
  fmlLocked   = true;
  fmlFinished = false;
  document.getElementById('fmlFinishOverlay').style.opacity = '0';
  document.getElementById('fmlFinishOverlay').style.pointerEvents = 'none';
}

// ── Render question ──────────────────────────────────────────
function fmlNextQuestion(){
  if(fmlIdx >= fmlPool.length){ fmlFinishSession(); return; }
  fmlCurrent   = fmlPool[fmlIdx++];
  fmlPhase     = 0;
  fmlTyped     = '';
  fmlLocked    = false;
  fmlWrongCount= 0;
  fmlHintEl.innerHTML = '';

  fmlSectionEl.textContent = fmlCurrent.section;
  fmlPromptEl.textContent  = fmlCurrent.prompt;
  fmlRebuildDisplay();

  fmlLineEl.classList.remove('anim');
  void fmlLineEl.offsetWidth;
  fmlLineEl.classList.add('anim');
}

function fmlRebuildDisplay(wrongPhase){
  fmlLineEl.innerHTML = '';
  const phases = fmlCurrent.phases;
  const isMulti = phases.length > 1;

  for(let i = 0; i < phases.length; i++){
    const phase = phases[i];
    const row = document.createElement('div');
    row.className = 'fml-phase-row';
    row.id = `fml-row-${i}`;

    if(isMulti){
      const lbl = document.createElement('span');
      lbl.className = 'fml-phase-label';
      lbl.textContent = `${i+1}.`;
      row.appendChild(lbl);
    }

    let rowState, typed;
    if(i < fmlPhase){
      rowState = 'done';
      typed = phaseKey(phase);
    } else if(i === fmlPhase){
      rowState = (wrongPhase === i) ? 'wrong' : 'active';
      typed = fmlTyped;
    } else {
      rowState = 'future';
      typed = '';
    }

    row.innerHTML += buildPhaseHTML(phase, typed, rowState);
    if(i === fmlPhase && wrongPhase !== i) insertCursor(row);
    fmlLineEl.appendChild(row);
  }
}

// ── Input handling ───────────────────────────────────────────
function fmlHandleChar(ch){
  if(fmlLocked || fmlFinished) return;
  fmlStartTimer();

  const phase  = fmlCurrent.phases[fmlPhase];
  const target = phaseKey(phase);
  const next   = fmlTyped + ch;

  if(!target.startsWith(next)){
    fmlTyped = '';
    fmlWrongCount++;
    if(fmlWrongCount >= 3){
      // show visual hint
      fmlHintEl.innerHTML = '';
      for(const tk of phase.tokens){
        const s = document.createElement('span');
        s.className = 'fml-tok done';
        s.innerHTML = tk.h;
        fmlHintEl.appendChild(s);
      }
    }
    const row = document.getElementById(`fml-row-${fmlPhase}`);
    if(row){
      row.classList.remove('shaking');
      void row.offsetWidth;
      row.classList.add('shaking');
      setTimeout(()=>{
        row.classList.remove('shaking');
        fmlRebuildDisplay();
      }, 380);
    }
    return;
  }

  fmlTyped = next;

  if(fmlTyped === target){
    fmlPhase++;
    fmlTyped = '';
    fmlWrongCount = 0;
    fmlHintEl.innerHTML = '';

    if(fmlPhase >= fmlCurrent.phases.length){
      fmlAnswered++;
      fmlProgressEl.textContent = `${fmlAnswered} / ${fmlPool.length}`;
      fmlLocked = true;
      // show all done then advance
      fmlRebuildDisplay();
      setTimeout(()=>{ fmlNextQuestion(); }, 380);
    } else {
      fmlRebuildDisplay();
    }
  } else {
    // update display with progress
    fmlRebuildDisplay();
  }
}

function fmlHandleBackspace(){
  if(fmlLocked || fmlFinished) return;
  if(fmlTyped.length > 0){
    fmlTyped = fmlTyped.slice(0, -1);
    fmlRebuildDisplay();
  }
}

// ── Auto-fill ────────────────────────────────────────────────
function fmlAutoFill(){
  if(fmlAutoHandle) return;
  autoFillMode = true;
  function tick(){
    if(currentMode !== 'formulas' || fmlFinished){ fmlAutoHandle=null; return; }
    if(fmlLocked){ fmlAutoHandle = setTimeout(tick, 60); return; }
    const phase  = fmlCurrent.phases[fmlPhase];
    const target = phaseKey(phase);
    if(fmlTyped.length < target.length){
      fmlHandleChar(target[fmlTyped.length]);
    }
    fmlAutoHandle = setTimeout(tick, 55);
  }
  fmlAutoHandle = setTimeout(tick, 80);
}

// ── Finish ───────────────────────────────────────────────────
function fmlFinishSession(){
  fmlFinished = true;
  const elapsed = Date.now() - fmlStartMs;
  fmlStopTimer();
  const result = saveRecord('formulas', 0, elapsed);

  const fo = document.getElementById('fmlFinishOverlay');
  document.getElementById('fmlFinishTime').textContent = fmtMs(elapsed);
  document.getElementById('fmlFinishLabel').textContent = `fórmulas · ${fmlPool.length} questões`;
  const fd = document.getElementById('fmlFinishDelta');
  if(autoFillMode){
    fd.textContent = '∗ modo automático · não salvo';
    fd.style.color = 'var(--txt-dim)';
  } else if(result.isNew){
    if(result.prev === null){
      fd.textContent = '✿ primeiro recorde';
      fd.style.color = 'var(--ac)';
    } else {
      fd.textContent = `▲ ${fmtMs(result.prev - elapsed)} mais rápido · novo recorde`;
      fd.style.color = 'var(--correct)';
    }
  } else {
    fd.textContent = `▼ ${fmtMs(elapsed - result.prev)} mais lento · recorde: ${fmtMs(result.prev)}`;
    fd.style.color = 'var(--wrong)';
  }

  document.getElementById('fmlOverlay').classList.remove('visible');
  fo.style.opacity = '1';
  fo.style.pointerEvents = 'auto';

  let cd = 5;
  const cdEl = document.getElementById('fmlFinishCountdown');
  if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
  if(window._fmlCdInterval) clearInterval(window._fmlCdInterval);
  window._fmlCdInterval = setInterval(()=>{
    cd--;
    if(cd <= 0){
      clearInterval(window._fmlCdInterval);
      window._fmlCdInterval = null;
      if(fmlFinished) startFmlSession();
    } else {
      if(cdEl) cdEl.textContent = `reiniciando em ${cd}s`;
    }
  }, 1000);
}

// ── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', function(e){
  if(currentMode !== 'formulas') return;

  if(fmlFinished){
    if(e.key === ' '){ e.preventDefault(); startFmlSession(); }
    if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); }
    return;
  }

  if(e.key === 'Escape'){ e.preventDefault(); setMode('table'); return; }
  if(e.key === 'Backspace'){ e.preventDefault(); fmlHandleBackspace(); return; }
  if(e.key === 'Enter'){ e.preventDefault(); return; }

  if(e.key.length === 1){
    e.preventDefault();
    fmlHandleChar(e.key);
  }
}, true);

})();
</script>
