<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTI · Enfermagem</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap');
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;}
*::-webkit-scrollbar{display:none;}
html,body{width:100%;height:100%;overflow:hidden;}

:root{
  --ac:rgba(188,168,110,0.9);
  --ac2:rgba(188,168,110,0.18);
  --ac3:rgba(188,168,110,0.07);
  --ac4:rgba(188,168,110,0.14);
  --ac5:rgba(188,168,110,0.04);
  --txt-dim:rgba(220,225,215,0.42);
  --txt-on:rgba(230,225,215,0.92);
  --txt-info:rgba(230,225,215,0.82);
  --correct:rgba(122,184,122,1);
  --wrong:#c86060;
  --mono:'Syne Mono',monospace;
}

#root{position:fixed;inset:0;background:#0a0a0a;overflow:hidden;display:flex;flex-direction:column;}

/* ── fundo animado: rio em ASCII (versão enxuta do original) ── */
#rw{width:100vw;height:100vh;position:absolute;top:0;left:0;z-index:0;overflow:hidden;background:#0a0a0a;}
#rc{display:block;position:absolute;top:0;left:0;}
#river-overlay{position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(6,6,8,0.5);}

#grain{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.03;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;animation:grainA 6s steps(1) infinite;}
@keyframes grainA{0%{background-position:0 0}12%{background-position:-31px 19px}25%{background-position:67px -24px}37%{background-position:-12px 43px}50%{background-position:54px 7px}62%{background-position:-61px -18px}75%{background-position:28px 57px}87%{background-position:-47px 33px}100%{background-position:0 0}}

#vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(6,6,8,0.55) 100%);}

#ui{position:relative;z-index:10;display:flex;flex-direction:column;width:100%;height:100%;padding:14px 18px 12px;gap:8px;}

#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;height:34px;position:relative;}
#topbarLeft{display:flex;align-items:center;gap:10px;position:relative;}
#brand{font-family:var(--mono);font-size:13px;letter-spacing:0.22em;color:var(--ac);text-transform:uppercase;opacity:0.85;}
#brand span{color:var(--txt-dim);}
#navBtns{display:flex;gap:8px;}
.navBtn{font-family:var(--mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--txt-dim);
  background:var(--ac3);border:1px solid var(--ac2);border-radius:6px;padding:8px 14px;cursor:pointer;transition:all .2s;}
.navBtn:hover{background:var(--ac2);color:var(--txt-on);}
.navBtn.active{background:var(--ac2);border-color:var(--ac);color:var(--ac);}

/* ── seletor de matérias ── */
#subjectBtn{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--ac);background:var(--ac3);border:1px solid var(--ac2);border-radius:6px;
  padding:8px 12px;cursor:pointer;transition:all .2s;}
#subjectBtn:hover{background:var(--ac2);border-color:var(--ac);}
#subjectBtn .chev{font-size:8px;opacity:0.6;transition:transform .2s;}
#subjectBtn.open .chev{transform:rotate(180deg);}
#subjectMenu{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;background:rgba(10,10,10,0.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ac2);border-radius:10px;
  padding:6px;z-index:50;opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .2s;}
#subjectMenu.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.subjectItem{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;color:var(--txt-info);
  padding:9px 12px;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.subjectItem:hover{background:var(--ac3);color:var(--txt-on);}
.subjectItem.active{background:var(--ac2);color:var(--ac);}
.subjectItem .cnt{font-size:9px;color:var(--txt-dim);letter-spacing:0.08em;}

#stage{flex:1;display:flex;min-height:0;position:relative;}
.view{position:absolute;inset:0;display:none;flex-direction:column;opacity:0;transition:opacity .3s;}
.view.show{display:flex;}
.view.visible{opacity:1;}

/* ═════ ESTUDO ═════ */
#studyWrap{align-items:center;justify-content:center;gap:14px;}
#topicRail{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:820px;margin-bottom:4px;}
.topicChip{font-family:var(--mono);font-size:9px;letter-spacing:0.08em;color:var(--txt-dim);
  background:var(--ac3);border:1px solid var(--ac2);border-radius:20px;padding:5px 11px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.topicChip:hover{color:var(--txt-on);border-color:var(--ac);}
.topicChip.active{background:var(--ac2);border-color:var(--ac);color:var(--ac);}

#card{width:min(720px,92vw);max-height:74vh;background:rgba(255,255,255,0.025);border:1px solid var(--ac2);
  border-radius:14px;padding:26px 30px;overflow-y:auto;transition:opacity .25s, transform .25s;}
#card.anim{animation:cardIn .32s cubic-bezier(.22,1,.36,1);}
@keyframes cardIn{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}
#cardNum{font-family:var(--mono);font-size:9px;letter-spacing:0.3em;color:var(--ac);opacity:0.6;text-transform:uppercase;margin-bottom:6px;}
#cardTitle{font-family:var(--mono);font-size:19px;letter-spacing:0.04em;color:var(--txt-on);margin-bottom:16px;line-height:1.4;}
.fact{display:flex;gap:10px;margin-bottom:13px;font-family:var(--mono);font-size:13px;line-height:1.65;color:var(--txt-info);letter-spacing:0.01em;}
.fact::before{content:'◆';color:var(--ac);font-size:9px;flex-shrink:0;margin-top:5px;opacity:0.75;}
.fact b{color:var(--ac);font-weight:400;}

#cardNav{display:flex;align-items:center;gap:16px;margin-top:6px;}
.roundBtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--ac2);background:var(--ac3);color:var(--ac);
  font-family:var(--mono);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.roundBtn:hover{background:var(--ac2);border-color:var(--ac);}
#dots{display:flex;gap:6px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ac2);transition:all .2s;cursor:pointer;}
.dot.active{background:var(--ac);width:16px;border-radius:3px;}

/* ═════ QUIZ ═════ */
#quizWrap{align-items:center;justify-content:center;}
#quizTop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:24px;padding:6px 0;}
#quizStreak,#quizScore{font-family:var(--mono);font-size:10px;letter-spacing:0.24em;color:var(--txt-dim);text-transform:uppercase;}
#quizStreak span,#quizScore span{color:var(--ac);}

#quizCard{width:min(640px,90vw);text-align:center;}
#quizTopic{font-family:var(--mono);font-size:9px;letter-spacing:0.32em;color:var(--ac);opacity:0.6;text-transform:uppercase;margin-bottom:18px;}
#quizStatement{font-family:var(--mono);font-size:clamp(15px,2.6vw,20px);line-height:1.7;color:var(--txt-on);letter-spacing:0.01em;margin-bottom:30px;min-height:90px;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 20px rgba(0,0,0,0.6);}
#quizStatement.anim{animation:qFade .28s cubic-bezier(.22,1,.36,1);}
@keyframes qFade{0%{opacity:0;transform:translateY(6px);}100%{opacity:1;transform:translateY(0);}}

#quizBtns{display:flex;gap:16px;justify-content:center;}
.qBtn{font-family:var(--mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--txt-on);
  background:var(--ac3);border:1px solid var(--ac2);border-radius:8px;padding:13px 34px;cursor:pointer;transition:all .15s;}
.qBtn:hover{background:var(--ac2);border-color:var(--ac);}
.qBtn.correct{background:rgba(122,184,122,0.18);border-color:var(--correct);color:var(--correct);}
.qBtn.wrong{background:rgba(200,96,96,0.18);border-color:var(--wrong);color:var(--wrong);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.shaking{animation:shake .4s ease;}

#quizFeedback{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;color:var(--txt-dim);margin-top:18px;min-height:34px;line-height:1.6;max-width:560px;opacity:0;transition:opacity .25s;}
#quizFeedback.show{opacity:1;}

#quizNext{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:0.2em;color:var(--ac);
  border:1px solid var(--ac2);background:var(--ac3);border-radius:20px;padding:7px 20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s;text-transform:uppercase;}
#quizNext.show{opacity:1;pointer-events:auto;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);font-family:var(--mono);font-size:11px;
  letter-spacing:0.18em;color:var(--ac);border:1px solid var(--ac2);background:rgba(10,10,10,0.85);padding:6px 16px;
  border-radius:20px;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;z-index:100;text-transform:uppercase;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  #topbar{flex-wrap:wrap;height:auto;}
  #card{padding:20px 18px;}
  .navBtn{padding:7px 10px;font-size:9px;}
}
</style>
</head>
<body>
<div id="root">
  <div id="rw"><canvas id="rc"></canvas></div>
  <div id="river-overlay"></div>
  <div id="grain"></div>
  <div id="vignette"></div>

  <div id="ui">
    <div id="topbar">
      <div id="topbarLeft">
        <button id="subjectBtn"><span id="subjectBtnLabel">Pacientes Críticos</span><span class="chev">▾</span></button>
        <div id="subjectMenu"></div>
      </div>
      <div id="navBtns">
        <button class="navBtn active" id="btnStudy">Estudar</button>
        <button class="navBtn" id="btnQuiz">Quiz</button>
      </div>
    </div>

    <div id="stage">
      <!-- ESTUDO -->
      <div class="view show visible" id="studyWrap">
        <div id="topicRail"></div>
        <div id="card">
          <div id="cardNum"></div>
          <div id="cardTitle"></div>
          <div id="factList"></div>
        </div>
        <div id="cardNav">
          <button class="roundBtn" id="prevBtn">‹</button>
          <div id="dots"></div>
          <button class="roundBtn" id="nextBtn">›</button>
        </div>
      </div>

      <!-- QUIZ -->
      <div class="view" id="quizWrap">
        <div id="quizTop">
          <div id="quizScore">acertos <span id="scoreVal">0/0</span></div>
          <div id="quizStreak">sequência <span id="streakVal">0</span></div>
        </div>
        <div id="quizCard">
          <div id="quizTopic"></div>
          <div id="quizStatement"></div>
          <div id="quizBtns">
            <button class="qBtn" id="btnTrue">Verdadeiro</button>
            <button class="qBtn" id="btnFalse">Falso</button>
          </div>
          <div id="quizFeedback"></div>
          <button id="quizNext">Próxima →</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════
// FUNDO · RIO EM ASCII (versão enxuta)
// ═══════════════════════════════════════════════════════════════
(function riverBG(){
const MONO_BG='"SF Mono",Monaco,Inconsolata,"Fira Code","Courier New",monospace';
const LAND=0,SHORE_OUTER=1,SHORE_INNER=2,WATER_SHALLOW=3,WATER_DEEP=4,WATER_DEEPEST=5;
const ZC={0:[' ',' ',' ',' ','.','.','.','"','"',',','·'],1:[' ',' ',' ','.','.','"',',','♣'],2:['|','|','¦',';',' ','♠'],3:[' ',' ','~','~','·'],4:[' ',' ',' ','~','·'],5:[' ',' ',' ','·']};
const WCHARS=['·','∘','~','∿','≈'];
const FCHARS=['·','*','✿','❀'];
const WZ=[WATER_SHALLOW,WATER_DEEP,WATER_DEEPEST];
const S={accent:[188,168,110],water_sh:['#4a5a5a','#5a6a65','#6a7a70','#7a8a7a'],water_dp:['#3a5a6a','#4a6a7a','#5a7080'],shore:['#5a5045','#6a6052','#7a7060','#8a806a','#9a9078','#a89880'],land:['#2a3028','#3a4038','#4a5045','#5a6052','#6a7060','#7a806a','#889578'],green:['#3a5038','#4a6048','#5a7058'],flower:['#c8a090','#d8b0a0','#e8b8b0','#f0c8c0'],dot:['#3a3a38','#3a3a3a','#3e3e3a'],bgBase:'#0a0a0a'};

function pickColor(arr,lp){return arr[Math.min(Math.floor(lp*arr.length),arr.length-1)];}
function colorFor(zone,ch,lp){
  if('~·∘∿≈'.includes(ch)){if(zone===WATER_SHALLOW)return pickColor(S.water_sh,lp);return pickColor(S.water_dp,lp);}
  if('❀✿*'.includes(ch))return pickColor(S.flower,lp);
  if('"'===ch||','===ch||"'"===ch||';'===ch||'`'===ch)return pickColor(S.land,lp);
  if('|'===ch||'¦'===ch)return pickColor(S.shore,lp);
  if('♣'===ch||'♠'===ch)return pickColor(S.green,lp);
  if('.'===ch)return pickColor(S.dot,lp);
  return '#505050';
}

const canvas=document.getElementById('rc');
const DPR=Math.min(window.devicePixelRatio||1,2);
let cW=window.innerWidth,cH=window.innerHeight;
canvas.width=Math.round(cW*DPR);canvas.height=Math.round(cH*DPR);
canvas.style.width=cW+'px';canvas.style.height=cH+'px';
const ctx=canvas.getContext('2d',{alpha:false});
const FONT_PX=14*DPR;
const CHAR_W=(25/3)*DPR;
const LINE_H=(67/3)*DPR;
let COLS=Math.ceil(canvas.width/CHAR_W)+2;
let VISIBLE_ROWS=Math.ceil(canvas.height/LINE_H)+2;
const TILE_ROWS=160;

function fade(t){return t*t*t*(t*(6*t-15)+10);}
function grad(h,x,y){const a=3&h,r=a<2?x:y,i=a<2?y:x;return((1&a)?-r:r)+((2&a)?-i:i);}
const perm=(function(seed){let p=[];for(let i=0;i<256;i++)p[i]=i;let s=seed;for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[p[i],p[j]]=[p[j],p[i]];}return[...p,...p];})(42);
function snoise(x,y){const xi=Math.floor(x)&255,yi=Math.floor(y)&255;const xf=x-Math.floor(x),yf=y-Math.floor(y);const u=fade(xf),v=fade(yf);const aa=perm[perm[xi]+yi],ab=perm[perm[xi]+yi+1],ba=perm[perm[xi+1]+yi],bb=perm[perm[xi+1]+yi+1];const r1=grad(aa,xf,yf)+(grad(ba,xf-1,yf)-grad(aa,xf,yf))*u;const r2=grad(ab,xf,yf-1)+(grad(bb,xf-1,yf-1)-grad(ab,xf,yf-1))*u;return r1+(r2-r1)*v;}
let rngS=42;function rng(){rngS=(rngS*16807)%2147483647;return rngS/2147483647;}

let TILE,RDATA;
function buildTile(){
  const tile=[],rdata=[];const seed=42;
  const minW=Math.floor(COLS*0.35),maxW=Math.floor(COLS*0.52);
  const cx=COLS/2;
  for(let r=0;r<TILE_ROWS;r++){
    const meander=0.38*Math.sin(0.008*r+seed)*Math.cos(0.003*r+1.1)+0.28*Math.sin(0.018*r+seed+2.3)+0.18*Math.sin(0.035*r+seed+4.7)*Math.cos(0.012*r+0.5)+0.10*Math.sin(0.055*r+seed+1.9)+0.06*Math.sin(0.09*r+seed+3.3);
    const center=Math.round(cx+meander*0.55*(0.3*COLS));
    const rwFactor=1+0.3*Math.sin(0.012*r+seed+100)*Math.cos(0.007*r+2.0)+0.15*Math.sin(0.025*r+seed+200)+0.1*Math.sin(0.04*r+seed+300);
    const rw=Math.round(Math.max(minW,Math.min(maxW,(minW+maxW)/2*rwFactor)));
    const lsh=Math.max(0,center-Math.round(rw/2));
    const rsh=Math.min(COLS-1,center+Math.round(rw/2));
    const lo=Math.max(2,Math.round(12*(1+0.35*Math.sin(0.025*r+seed+200)*0.5)));
    const li=Math.max(1,Math.round(3*(1+0.3*Math.sin(0.025*r+seed+300)*0.4)));
    const ld=Math.max(2,Math.round(5*(1+0.35*Math.sin(0.025*r+seed+400)*0.5)));
    const lx=Math.max(2,Math.round(10*(1+0.35*Math.sin(0.025*r+seed+500)*0.7)));
    rdata.push({lsh,rsh,center,rw});
    const row=[];
    for(let c=0;c<COLS;c++){
      const lt=c-lsh,rt=rsh-c;let zone;
      if(c<lsh-lo-li)zone=LAND;else if(c<lsh-li)zone=SHORE_OUTER;else if(c<lsh)zone=SHORE_INNER;
      else if(c>rsh+lo+li)zone=LAND;else if(c>rsh+li)zone=SHORE_OUTER;else if(c>rsh)zone=SHORE_INNER;
      else{const dc=Math.abs(c-center);if(dc<lx/2)zone=WATER_DEEPEST;else if(Math.min(lt,rt)<ld)zone=WATER_SHALLOW;else zone=WATER_DEEP;}
      const chars=ZC[zone];const ch=chars[Math.floor(rng()*chars.length)];
      row.push({ch,base:ch,zone,lp:0.5,op:1,rot:0,vis:true});
    }
    tile.push(row);
  }
  return{tile,rdata};
}
function tileRow(r){return((r%TILE_ROWS)+TILE_ROWS)%TILE_ROWS;}

function updateTile(f){
  const t=f*0.13;
  for(let r=0;r<TILE_ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=TILE[r][c];
      if(WZ.includes(cell.zone)){
        const n=snoise(0.035*c+0.0005*t,0.018*r-0.0007*t);
        const thr=cell.zone===WATER_DEEPEST?-0.22:cell.zone===WATER_DEEP?-0.02:-0.2;
        const p=n-thr;
        if(p>0){cell.vis=true;const idx=Math.min(Math.floor((p/0.6)*WCHARS.length),WCHARS.length-1);cell.ch=WCHARS[idx];cell.op=Math.min(1,p*2.5);const nx2=snoise(0.035*c+0.0005*t+0.5,0.018*r-0.0007*t);cell.rot=90+(n-nx2)*80;}
        else{cell.vis=false;cell.ch=' ';cell.op=0;}
        const la=Math.PI/2+0.25*snoise(0.0015*t,100);
        cell.lp=Math.max(0,Math.min(1,(Math.sin(c*Math.cos(la)*0.07+r*Math.sin(la)*0.045-0.01*t)+0.2*snoise(0.04*c+50,0.04*r+50)+1)*0.45));
      } else {
        const la2=Math.PI/2+0.4*snoise(0.0015*t,100);
        cell.lp=Math.max(0,Math.min(1,(Math.sin(c*Math.cos(la2)*0.07+r*Math.sin(la2)*0.045-0.009*t)+0.2*snoise(0.04*c+50,0.04*r+50)+1)*0.45));
        if((cell.zone===LAND||cell.zone===SHORE_OUTER)&&cell.base==='·'){const fi=Math.min(Math.floor(cell.lp*FCHARS.length),FCHARS.length-1);cell.ch=FCHARS[fi];}
      }
    }
  }
}

function renderBG(){
  ctx.fillStyle=S.bgBase;ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.font=`${FONT_PX}px ${MONO_BG}`;ctx.textBaseline='top';
  for(let r=0;r<VISIBLE_ROWS;r++){
    const py=r*LINE_H;if(py>canvas.height+LINE_H)continue;
    const row=TILE[tileRow(r)];
    for(let c=0;c<COLS;c++){
      const cell=row[c];const ch=cell.ch;if(!ch||ch===' ')continue;
      const px=c*CHAR_W,lp=cell.lp||0.5;
      const color=colorFor(cell.zone,ch,lp);
      if(WZ.includes(cell.zone)&&'~·∘∿≈'.includes(ch)&&cell.vis&&cell.op>0.05){
        ctx.save();ctx.globalAlpha=Math.min(1,cell.op);
        const cxp=px+CHAR_W/2,cyp=py+FONT_PX/2;
        ctx.translate(cxp,cyp);ctx.rotate((cell.rot||0)*Math.PI/180);ctx.translate(-cxp,-cyp);
        ctx.fillStyle=color;ctx.fillText(ch,px,py);ctx.restore();
      } else {ctx.fillStyle=color;ctx.fillText(ch,px,py);}
    }
  }
}

let bgFrame=0;
function build(){const built=buildTile();TILE=built.tile;RDATA=built.rdata;}
build();updateTile(0);

let lastTs=0;
function loop(ts){
  if(!lastTs)lastTs=ts;lastTs=ts;
  bgFrame++;
  if(bgFrame%3===0)updateTile(bgFrame);
  renderBG();

    "O carro de emergência tem lacre de segurança e gavetas padronizadas: <b>1ª medicamentos, 2ª acessos, 3ª intubação, 4ª soluções</b>, com reposição imediata após o uso."
  ]
},
{
  title:"Admissão por Prioridades (1 a 5)",
  facts:[
    "A UTI é gerida por <b>prioridades</b>, não por ordem de chegada.",
    "<b>Prioridade 1</b>: precisa de suporte à vida (VM, drogas vasoativas), alta chance de recuperação, sem limitação de suporte terapêutico.",
    "<b>Prioridade 2</b>: precisa de monitorização intensiva por alto risco, estável no momento mas potencialmente crítico, sem limitações terapêuticas.",

  ]
},
{

  facts:[
    "<b>Porta-médico</b>: avaliação pelo intensivista em menos de <b>10 minutos</b>.",

    "Janela terapêutica para trombolíticos (ex: Tenecteplase - TNK): sintomas iniciados há menos de <b>4h30</b>.",

    "<b>Porta-virilha</b> (trombectomia, casos graves): prazo de <b>120 minutos</b>.",
    "Neuro check pós-trombólise: a cada <b>15 min</b> nas primeiras 2h, a cada <b>30 min</b> nas 6h seguintes, e a cada <b>1 hora</b> até completar 24h."
  ]
},
{
  title:"Medicações Específicas (MAV e Psicotrópicos)",
  facts:[
    "<b>Naloxona</b> (intoxicações): não deve ser misturada com substâncias de pH alcalino nem com nenhuma outra substância na mesma via.",

  ]
},
{
  title:"Cuidados de Enfermagem no Choque",
  facts:[
    "Elevar os membros inferiores na mesma altura para ajudar o retorno venoso (exceto se contraindicado).",
    "Instalar O2 sob máscara a <b>10L/min</b>, puncionar acesso de grosso calibre e manter o paciente aquecido.",
    "Iniciar reposição de líquidos conforme prescrição e monitorar sinais de hidratação excessiva (edemas, estertores pulmonares)."
  ]
},
{
  title:"Acessos Vasculares (Port-a-Cath) e Balanço Hídrico",
  facts:[
    "O <b>scalp de Huber</b> do Port-a-Cath deve ser trocado a cada <b>7 dias</b> — procedimento exclusivo do enfermeiro.",
    "A troca do circuito venoso ocorre a cada <b>72 horas</b>.",
    "Sinais de infecção no cateter: febre (≥37,8ºC), dor, rubor e calor no local.",
    "Ganhos no BH incluem soros, dietas, gelatina, sorvete e sopa liquidificada; perdas incluem urina, vômitos, secreções, drenagens e diarreia.",
    "Débito em fralda: pesar a fralda usada e descontar o peso da fralda seca (entre <b>80g e 120g</b>, conforme o modelo)."
  ]
},
{
  title:"Passagem de Plantão e Prevenção de Quedas",
  facts:[
    "A passagem de plantão deve ocorrer em ambiente tranquilo, livre de interrupções, com tempo para esclarecer dúvidas.",
    "Prevenção de lesão por pressão: lençóis secos e sem vincos, pele hidratada com ácidos graxos essenciais, e mudança de decúbito.",
    "A contenção mecânica só deve ser usada em agitação extrema, após análise criteriosa, autorização de familiares e conforme protocolo institucional."
  ]
}
  ],
  quiz:[
{t:"O tempo padrão para alocar o paciente no leito após a decisão médica é de 90 minutos.",a:true,e:"Correto — esse é o tempo 'contratado' para a gestão de leitos."},
{t:"Resultados de exames laboratoriais de urgência devem sair em até 1 hora.",a:false,e:"O prazo é de 30 minutos para urgência; exames de rotina têm até 4 horas."},
{t:"Medicamentos urgentes (lotes 'agora' e 'ACM') devem ser entregues pela farmácia em 20 minutos.",a:true,e:"Correto — é um dos tempos-padrão de contratualização entre setores."},
{t:"Na RCP, a Adrenalina deve ser administrada a cada 3 a 5 minutos.",a:true,e:"Correto — esse intervalo é rigorosamente seguido durante a reanimação."},
{t:"As Metas Internacionais de Segurança do Paciente somam ao todo 4 metas.",a:false,e:"São 6 metas: identificação, comunicação, MAV, cirurgia segura, redução de infecções e prevenção de quedas/lesões por pressão."},
{t:"A identificação correta do paciente exige pelo menos dois identificadores, como nome e data de nascimento.",a:true,e:"Correto — evita erros de troca de paciente."},
{t:"O Time Out é uma pausa realizada depois da incisão cirúrgica, para conferência final.",a:false,e:"O Time Out é feito ANTES da incisão, confirmando paciente, local e procedimento."},
{t:"Um 'near miss' é um erro que chegou a causar dano ao paciente.",a:false,e:"Near miss é o erro que NÃO atingiu o paciente — foi percebido a tempo."},
{t:"Uma queda com fratura é classificada como evento adverso.",a:true,e:"Correto — evento adverso é o incidente que causa dano real ao paciente."},
{t:"O NPS (Net Promoter Score) é uma ferramenta que mede a qualidade percebida pelo paciente.",a:true,e:"Correto — junto com Hfocus e Hcahps, mede o nível de recomendação do serviço."},
{t:"Medicamentos de Alta Vigilância podem ser armazenados normalmente nas áreas assistenciais comuns.",a:false,e:"MAV não devem ficar em áreas comuns — apenas destinados a paciente específico ou no carro de emergência."},
{t:"A administração de MAV exige dupla checagem por dois profissionais de enfermagem.",a:true,e:"Correto — é obrigatória essa conferência dupla antes de aplicar."},
{t:"O enfermeiro pode delegar a limpeza e conferência técnica do carro de emergência ao técnico de enfermagem, sob supervisão.",a:true,e:"Correto — mas a responsabilidade legal continua sendo do enfermeiro."},
{t:"A gaveta 1 do carro de emergência é destinada aos acessos vasculares.",a:false,e:"A gaveta 1 é de medicamentos. Acessos ficam na gaveta 2, intubação na 3ª e soluções na 4ª."},
{t:"Prioridade 1 são pacientes com doença terminal, sem possibilidade de recuperação.",a:false,e:"Isso é a Prioridade 5. A Prioridade 1 é para quem precisa de suporte à vida e tem alta chance de recuperação."},
{t:"Prioridade 2 são pacientes estáveis no momento, mas potencialmente críticos, sem limitação terapêutica.",a:true,e:"Correto — precisam de monitorização intensiva pelo alto risco de piora."},
{t:"Prioridade 3 inclui pacientes com ordem de não reanimar que ainda precisam de suporte à vida.",a:true,e:"Correto — precisam de suporte, mas têm baixa chance de recuperação ou limitação terapêutica definida."},
{t:"Pacientes de Prioridade 5 nunca são admitidos na UTI, nem como doadores de órgãos.",a:false,e:"A exceção é justamente quando são potenciais doadores de órgãos."},
{t:"No protocolo MOVE, o 'V' significa Ventilação.",a:false,e:"O 'V' é de Veia — acesso calibroso. MOVE é Monitorização, Oxigênio, Veia e Exames."},
{t:"No AVC, a avaliação médica (porta-médico) deve ocorrer em menos de 10 minutos.",a:true,e:"Correto — é o primeiro tempo crítico do protocolo de AVC."},
{t:"A janela terapêutica para uso de trombolíticos no AVC é de até 4h30 do início dos sintomas.",a:true,e:"Correto — depois desse prazo, o risco geralmente supera o benefício do trombolítico."},
{t:"O tempo porta-agulha (início do trombolítico) deve ser de até 60 minutos.",a:true,e:"Correto — é uma das metas centrais do protocolo tempo-dependente do AVC."},
{t:"O tempo porta-virilha, para trombectomia, é de até 120 minutos.",a:true,e:"Correto — é o prazo para os casos mais graves que exigem intervenção mecânica."},
{t:"A Naloxona pode ser misturada com outras substâncias na mesma via sem problema.",a:false,e:"A Naloxona não deve ser misturada com substâncias de pH alcalino nem com nenhuma outra substância na mesma via."},
{t:"O Haloperidol via EV exige monitoração com ECG pelo risco de prolongamento do intervalo QT.",a:true,e:"Correto — há risco de arritmias graves associado ao uso EV."},
{t:"A Clorpromazina pode ser administrada junto com levodopa sem restrições.",a:false,e:"A Clorpromazina não deve ser associada a levodopa, álcool ou lítio."},
{t:"Em caso de choque, deve-se instalar O2 sob máscara a 10L/min e puncionar acesso calibroso.",a:true,e:"Correto — faz parte da assistência imediata no choque."},
{t:"O scalp de Huber do Port-a-Cath deve ser trocado a cada 30 dias.",a:false,e:"A troca é a cada 7 dias, e é procedimento exclusivo do enfermeiro."},
{t:"A troca do circuito venoso do Port-a-Cath ocorre a cada 72 horas.",a:true,e:"Correto — esse é o intervalo padrão de troca do circuito."},
{t:"Sorvete e gelatina entram na contagem de ganhos no balanço hídrico.",a:true,e:"Correto — junto com soros, dietas e sopas liquidificadas."},
{t:"Para calcular o débito em fralda, basta pesar a fralda usada sem descontar nada.",a:false,e:"É preciso descontar o peso da fralda seca (entre 80g e 120g, conforme o modelo)."},
{t:"A passagem de plantão deve acontecer em ambiente tranquilo, sem interrupções.",a:true,e:"Correto — faz parte da meta de comunicação efetiva."},
{t:"A contenção mecânica pode ser usada livremente, sem necessidade de autorização de familiares.",a:false,e:"Só deve ser usada em agitação extrema, após análise criteriosa e autorização de familiares, conforme protocolo institucional."}
  ]
};

let currentSubjectId = 'pacientes_criticos';
let TOPICS = SUBJECTS[currentSubjectId].topics;
let QUIZ = SUBJECTS[currentSubjectId].quiz;

// ═══ SELETOR DE MATÉRIAS ═══
const subjectBtn=document.getElementById('subjectBtn');
const subjectBtnLabel=document.getElementById('subjectBtnLabel');
const subjectMenu=document.getElementById('subjectMenu');

function buildSubjectMenu(){
  subjectMenu.innerHTML='';
  Object.keys(SUBJECTS).forEach(id=>{
    const sub=SUBJECTS[id];
    const item=document.createElement('div');
    item.className='subjectItem'+(id===currentSubjectId?' active':'');
    item.innerHTML=`<span>${sub.name}</span><span class="cnt">${sub.topics.length} tópicos</span>`;
    item.onclick=()=>{selectSubject(id);closeSubjectMenu();};
    subjectMenu.appendChild(item);
  });
}
function openSubjectMenu(){subjectMenu.classList.add('open');subjectBtn.classList.add('open');}
function closeSubjectMenu(){subjectMenu.classList.remove('open');subjectBtn.classList.remove('open');}
subjectBtn.onclick=(e)=>{e.stopPropagation();subjectMenu.classList.contains('open')?closeSubjectMenu():openSubjectMenu();};
document.addEventListener('click',(e)=>{if(!subjectBtn.contains(e.target)&&!subjectMenu.contains(e.target))closeSubjectMenu();});

function selectSubject(id){
  if(id===currentSubjectId){return;}
  currentSubjectId=id;
  const sub=SUBJECTS[id];
  subjectBtnLabel.textContent=sub.name;
  TOPICS=sub.topics;QUIZ=sub.quiz;
  buildSubjectMenu();
  railEl.innerHTML='';buildRail();buildDots();renderTopic(0);
  quizWrap.dataset.started='';newOrder();score=0;total=0;streak=0;
  scoreVal.textContent='0/0';streakVal.textContent='0';
  if(quizWrap.classList.contains('show')){quizWrap.dataset.started='1';showQuiz();}
}

// ═══ STUDY VIEW ═══
let curTopic=0;
const railEl=document.getElementById('topicRail');
const cardEl=document.getElementById('card');
const cardNum=document.getElementById('cardNum');
const cardTitle=document.getElementById('cardTitle');
const factList=document.getElementById('factList');
const dotsEl=document.getElementById('dots');

function buildRail(){
  TOPICS.forEach((tp,i)=>{
    const chip=document.createElement('div');
    chip.className='topicChip'+(i===0?' active':'');
    chip.textContent=(i+1)+'. '+tp.title.split(' ').slice(0,3).join(' ')+'…';
    chip.title=tp.title;
    chip.onclick=()=>renderTopic(i);
    railEl.appendChild(chip);
  });
}
function buildDots(){
  dotsEl.innerHTML='';
  TOPICS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.onclick=()=>renderTopic(i);
    dotsEl.appendChild(d);
  });
}
function renderTopic(i){
  curTopic=i;
  const tp=TOPICS[i];
  cardNum.textContent='tópico '+(i+1)+' / '+TOPICS.length;
  cardTitle.textContent=tp.title;
  factList.innerHTML=tp.facts.map(f=>`<div class="fact">${f}</div>`).join('');
  [...railEl.children].forEach((c,idx)=>c.classList.toggle('active',idx===i));
  [...dotsEl.children].forEach((d,idx)=>d.classList.toggle('active',idx===i));
  cardEl.classList.remove('anim');void cardEl.offsetWidth;cardEl.classList.add('anim');
  cardEl.scrollTop=0;
}
document.getElementById('prevBtn').onclick=()=>renderTopic((curTopic-1+TOPICS.length)%TOPICS.length);
document.getElementById('nextBtn').onclick=()=>renderTopic((curTopic+1)%TOPICS.length);

buildSubjectMenu();buildRail();buildDots();renderTopic(0);

// ═══ QUIZ VIEW ═══
let order=[],qi=0,score=0,total=0,streak=0,answered=false;
const quizTopic=document.getElementById('quizTopic');
const quizStatement=document.getElementById('quizStatement');
const btnTrue=document.getElementById('btnTrue');
const btnFalse=document.getElementById('btnFalse');
const quizFeedback=document.getElementById('quizFeedback');
const quizNext=document.getElementById('quizNext');
const scoreVal=document.getElementById('scoreVal');
const streakVal=document.getElementById('streakVal');
const toast=document.getElementById('toast');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newOrder(){order=shuffle(QUIZ.map((_,i)=>i));qi=0;}
function showQuiz(){
  answered=false;
  const q=QUIZ[order[qi]];
  quizTopic.textContent='pergunta '+(qi+1)+' / '+order.length;
  quizStatement.textContent=q.t;
  quizStatement.classList.remove('anim');void quizStatement.offsetWidth;quizStatement.classList.add('anim');
  btnTrue.className='qBtn';btnFalse.className='qBtn';
  btnTrue.disabled=false;btnFalse.disabled=false;
  quizFeedback.classList.remove('show');quizFeedback.innerHTML='';
  quizNext.classList.remove('show');
}
function answer(val){
  if(answered)return;answered=true;
  const q=QUIZ[order[qi]];
  total++;
  const correct=(val===q.a);
  if(correct){score++;streak++;}else{streak=0;}
  scoreVal.textContent=score+'/'+total;
  streakVal.textContent=streak;
  const trueBtn=btnTrue,falseBtn=btnFalse;
  const rightBtn=q.a?trueBtn:falseBtn;
  const pickedBtn=val?trueBtn:falseBtn;
  rightBtn.classList.add('correct');
  if(!correct){pickedBtn.classList.add('wrong');pickedBtn.classList.add('shaking');setTimeout(()=>pickedBtn.classList.remove('shaking'),400);}
  btnTrue.disabled=true;btnFalse.disabled=true;
  quizFeedback.innerHTML=(correct?'✓ Certo. ':'✗ Quase. ')+q.e;
  quizFeedback.classList.add('show');
  quizNext.classList.add('show');
  if(streak>0 && streak%5===0)showToast('sequência de '+streak+' 🔥');
}
btnTrue.onclick=()=>answer(true);
btnFalse.onclick=()=>answer(false);
quizNext.onclick=()=>{
  qi++;
  if(qi>=order.length){newOrder();showToast('rodada concluída · reiniciando');}
  showQuiz();
};
function showToast(msg){
  toast.textContent=msg;toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>toast.classList.remove('show'),1800);
}

newOrder();

// ═══ NAV ═══
const btnStudy=document.getElementById('btnStudy');
const btnQuiz=document.getElementById('btnQuiz');
const studyWrap=document.getElementById('studyWrap');
const quizWrap=document.getElementById('quizWrap');

function switchView(v){
  if(v==='study'){
    btnStudy.classList.add('active');btnQuiz.classList.remove('active');
    studyWrap.classList.add('show');quizWrap.classList.remove('show');
    requestAnimationFrame(()=>{studyWrap.classList.add('visible');quizWrap.classList.remove('visible');});
  }else{
    btnQuiz.classList.add('active');btnStudy.classList.remove('active');
    quizWrap.classList.add('show');
    if(!quizWrap.dataset.started){quizWrap.dataset.started='1';showQuiz();}
    requestAnimationFrame(()=>{quizWrap.classList.add('visible');studyWrap.classList.remove('visible');});
  }
  setTimeout(()=>{[studyWrap,quizWrap].forEach(el=>{if(!el.classList.contains('visible'))el.classList.remove('show');});},320);
}
btnStudy.onclick=()=>switchView('study');
btnQuiz.onclick=()=>switchView('quiz');

})();
</script>
